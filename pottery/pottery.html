<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liminal — Amanda Cui</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Neuton:wght@300;400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f9f6f2;
            --text: #3d2e1c;
            --accent: #664930;
            --muted: #9b8472;
            --font: 'Neuton', serif;
            --font-heading: 'Neuton', serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        a { text-decoration: none; color: inherit; }

        nav {
            position: fixed; top: 0; left: 0; right: 0; z-index: 50;
            height: 56px; display: flex; align-items: center; padding: 0 2.5rem;
            justify-content: space-between;
            background: rgba(249,246,242,0.85); backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .nav-name {
            font-family: var(--font-heading); font-size: 0.9rem;
            font-weight: 500; letter-spacing: 0.08em; transition: color 0.2s;
        }

        .nav-name:hover { color: var(--accent); }
        .nav-links { display: flex; gap: 1.5rem; align-items: center; }
        .nav-link { font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); transition: color 0.2s; }
        .nav-link:hover { color: var(--text); }
        @media (max-width: 600px) { .nav-links { display: none; } }

        .page-header {
            padding: 5.5rem 6vw 1.5rem;
        }

        .page-header h1 {
            font-family: var(--font-heading);
            font-size: clamp(1.6rem, 4vw, 3.2rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.15;
        }

        .page-header p {
            margin-top: 0.75rem;
            font-size: 1rem;
            color: var(--muted);
            max-width: 52ch;
            line-height: 1.6;
        }

        /* Filter bar */
        .filter-bar {
            padding: 1.25rem 6vw 0;
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            align-items: center;
        }

        .filter-btn {
            background: none;
            border: 1px solid rgba(102,73,48,0.25);
            border-radius: 20px;
            padding: 5px 16px;
            font-family: var(--font);
            font-size: 0.82rem;
            letter-spacing: 0.06em;
            color: var(--muted);
            cursor: pointer;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
            white-space: nowrap;
        }

        .filter-btn:hover {
            background: rgba(102,73,48,0.07);
            color: var(--text);
        }

        .filter-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #f9f6f2;
        }

        .filter-divider {
            width: 1px;
            height: 18px;
            background: rgba(102,73,48,0.2);
            margin: 0 4px;
        }

        .piece-count {
            display: inline-block;
            padding: 1rem 6vw 0;
            font-size: 0.75rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
        }

        /* Gallery grid */
        .gallery {
            padding: 1rem 6vw 6rem;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            justify-items: center;
        }

        .piece {
            cursor: pointer;
            width: 100%;
        }

        .piece-img-wrap {
            position: relative;
            overflow: hidden;
            aspect-ratio: 1 / 1;
            background: transparent;
        }

        .piece-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
            display: block;
            filter: brightness(1.0);
            transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .piece-img-wrap img[data-no-image],
        .piece-no-image {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background: #ede8e1;
            color: var(--muted);
            font-size: 0.72rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .piece:hover .piece-img-wrap img {
            transform: scale(1.25);
        }

        .piece-info {
            padding: 10px 2px 4px;
            text-align: center;
        }

        .piece-name {
            font-family: var(--font-heading);
            font-size: 0.88rem;
            font-weight: 500;
            color: var(--text);
        }

        .piece-price {
            font-size: 1rem;
            font-weight: 700;
            color: var(--accent);
            margin-top: 3px;
        }

        .piece-price.gifted {
            font-size: 0.8rem;
            font-weight: 400;
            color: var(--muted);
            font-style: italic;
        }

        .piece-price.sold {
            font-size: 0.82rem;
            font-weight: 600;
            color: #c0392b;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(20, 12, 5, 0.97);
            z-index: 200;
            overflow-y: auto;
        }

        .lightbox.active { display: block; }

        .lightbox-close {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            color: rgba(255,255,255,0.6);
            font-size: 1.8rem;
            cursor: pointer;
            z-index: 201;
            line-height: 1;
            transition: color 0.2s;
            width: 2.5rem;
            height: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lightbox-close:hover { color: #fff; }

        .lightbox-body {
            max-width: 960px;
            margin: 0 auto;
            padding: 4rem 2rem 5rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            align-items: start;
        }

        .lightbox-main-img {
            width: 100%;
            height: auto;
            display: block;
        }

        .lightbox-info {
            color: #f9f6f2;
            padding-top: 0.5rem;
        }

        .lightbox-number {
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: rgba(249,246,242,0.45);
            margin-bottom: 0.75rem;
        }

        .lightbox-name {
            font-family: var(--font-heading);
            font-size: clamp(1.5rem, 3vw, 2.5rem);
            font-weight: 500;
            line-height: 1.1;
            margin-bottom: 0.75rem;
        }

        .lightbox-price {
            font-size: 1.4rem;
            font-weight: 700;
            color: #f9f6f2;
            margin-bottom: 1rem;
        }

        .lightbox-price.gifted {
            font-size: 1rem;
            font-weight: 400;
            font-style: italic;
            color: rgba(249,246,242,0.6);
        }

        .lightbox-desc {
            font-size: 0.95rem;
            line-height: 1.7;
            color: rgba(249,246,242,0.7);
            margin-bottom: 1.25rem;
        }

        .lightbox-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.75rem;
        }

        .lightbox-meta span {
            font-size: 0.72rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: rgba(249,246,242,0.45);
            background: rgba(255,255,255,0.07);
            padding: 3px 10px;
            border-radius: 20px;
        }

        .lightbox-progress {
            margin-top: 2rem;
        }

        .lightbox-progress-label {
            font-size: 0.7rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: rgba(249,246,242,0.35);
            margin-bottom: 0.75rem;
        }

        .progress-slideshow { position: relative; }

        .progress-slide {
            position: relative;
            background: rgba(255,255,255,0.04);
            cursor: pointer;
        }

        .progress-slide img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
            transition: opacity 0.2s;
        }

        .progress-slide img:hover { opacity: 0.9; }

        .progress-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.45);
            border: none;
            color: rgba(255,255,255,0.8);
            font-size: 1.2rem;
            padding: 0.4rem 0.7rem;
            cursor: pointer;
            transition: background 0.2s;
            z-index: 2;
            line-height: 1;
        }

        .progress-nav:hover { background: rgba(0,0,0,0.7); color: #fff; }
        .progress-nav-prev { left: 0; }
        .progress-nav-next { right: 0; }

        .progress-counter {
            text-align: center;
            margin-top: 0.4rem;
            font-size: 0.68rem;
            letter-spacing: 0.12em;
            color: rgba(249,246,242,0.3);
        }

        .progress-dots {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-top: 0.5rem;
        }

        .progress-dot {
            width: 5px; height: 5px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            cursor: pointer;
            transition: background 0.2s;
            border: none;
            padding: 0;
        }

        .progress-dot.active { background: rgba(255,255,255,0.7); }

        /* Full image overlay */
        .img-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.97);
            z-index: 300;
            align-items: center;
            justify-content: center;
        }

        .img-overlay.active { display: flex; }

        .img-overlay img {
            max-width: 92vw;
            max-height: 92vh;
            object-fit: contain;
        }

        .img-overlay-close {
            position: fixed;
            top: 1.5rem; right: 1.5rem;
            color: rgba(255,255,255,0.6);
            font-size: 1.8rem;
            cursor: pointer;
            z-index: 301;
            transition: color 0.2s;
        }

        .img-overlay-close:hover { color: #fff; }

        .loading {
            padding: 5rem 6vw;
            color: var(--muted);
            font-size: 0.9rem;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .lightbox-body { grid-template-columns: 1fr; gap: 1.5rem; }
            .gallery { grid-template-columns: repeat(3, 1fr); }
        }

        @media (max-width: 650px) {
            nav { padding: 0 1.25rem; }
            .page-header { padding: 4.5rem 5vw 1rem; }
            .filter-bar { padding: 1rem 5vw 0; gap: 0.4rem; }
            .filter-btn { font-size: 0.78rem; padding: 4px 12px; }
            .piece-count { padding: 0.75rem 5vw 0; }
            .gallery { grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 0.75rem 3vw 4rem; }
            .piece-name { font-size: 0.8rem; }
            .piece-price { font-size: 0.9rem; }
            .lightbox-body { padding: 3rem 1.25rem 4rem; }
            .lightbox-close { top: 1rem; right: 1rem; }
            .lightbox-price { font-size: 1.2rem; }
        }

        @media (max-width: 400px) {
            .gallery { gap: 8px; padding: 0.75rem 2vw 4rem; }
            .piece-name { font-size: 0.75rem; }
            .lightbox-body { padding: 2.5rem 1rem 3rem; }
            .lightbox-name { font-size: 1.4rem; }
        }
    </style>
</head>
<body>
    <nav>
        <a href="../Title%20Page/" class="nav-name">Liminal</a>
        <div class="nav-links">
            <a href="../About%20Me/about.html" class="nav-link">About</a>
            <a href="../storytelling/storytelling.html" class="nav-link">Storytelling</a>
            <a href="../ongoing%20projects/ongoing-projects.html" class="nav-link">Projects</a>
            <a href="../creative%20collaborations/creative-collaborations.html" class="nav-link">Collabs</a>
        </div>
    </nav>

    <div class="page-header">
        <h1>Liminal: A record of creation between stages</h1>
        <p>Thank you for coming to my exhibit. Below are the prices for each piece displayed. If interested in purchasing, please find Helen.</p>
    </div>

    <div class="filter-bar" id="filter-bar">
        <button class="filter-btn active" onclick="setFilter('all')">All</button>
        <button class="filter-btn" onclick="setFilter('available')">Available</button>
        <button class="filter-btn" onclick="setFilter('gifted')">Gifted</button>
        <button class="filter-btn" onclick="setFilter('sold')">Sold</button>
        <div class="filter-divider"></div>
        <button class="filter-btn sort-btn" id="sort-price-btn" onclick="toggleSortPrice()">Price ↑</button>
        <div class="filter-divider"></div>
        <!-- Category filters injected by JS -->
    </div>

    <div class="piece-count" id="piece-count"></div>

    <div class="gallery" id="gallery">
        <div class="loading">Loading pieces...</div>
    </div>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox" onclick="if(event.target.id==='lightbox')closeLightbox()">
        <span class="lightbox-close" onclick="closeLightbox()">&#215;</span>
        <div class="lightbox-body" id="lightbox-body"></div>
    </div>

    <!-- Full image overlay -->
    <div class="img-overlay" id="imgOverlay" onclick="closeImgOverlay()">
        <span class="img-overlay-close" onclick="closeImgOverlay()">&#215;</span>
        <img id="imgOverlayImg" src="" alt="">
    </div>

    <script>
        let allPieces = [];
        let pieces = [];
        let activeFilter = 'all';
        let activeCat = '';
        let sortByPrice = null; // null = default, 'asc', 'desc'

        function inferCategory(piece) {
            return piece.type || 'Other';
        }

        function pieceStatus(p) {
            const loc = (p.location || p.home || '').toLowerCase();
            if (p.soldPrice || loc === 'sold') return 'sold';
            if (loc.startsWith('gifted to') || loc === 'gifted') return 'gifted';
            if (p.suggestedPrice) return 'available';
            return 'other';
        }

        function getPriceLabel(piece, forCard = true) {
            const status = pieceStatus(piece);
            if (status === 'sold') {
                const soldAmt = piece.soldPrice ? ` · NTD ${piece.soldPrice}` : '';
                return forCard
                    ? `<div class="piece-price sold">Sold${soldAmt}</div>`
                    : `<div class="lightbox-price sold">Sold${soldAmt}</div>`;
            }
            if (piece.suggestedPrice) {
                return forCard
                    ? `<div class="piece-price">NTD ${piece.suggestedPrice}</div>`
                    : `<div class="lightbox-price">NTD ${piece.suggestedPrice}</div>`;
            }
            if (status === 'gifted') {
                const loc = piece.location || piece.home || '';
                const name = loc.replace(/^gifted to\s*/i, '').trim();
                return forCard
                    ? `<div class="piece-price gifted">gifted to ${name}</div>`
                    : `<div class="lightbox-price gifted">gifted to ${name}</div>`;
            }
            return '';
        }

        function enc(p) {
            if (!p) return '';
            if (p.startsWith('data:') || p.startsWith('http')) return p;
            return p.split('/').map(s => encodeURIComponent(s)).join('/');
        }

        function toggleSortPrice() {
            const btn = document.getElementById('sort-price-btn');
            if (!sortByPrice || sortByPrice === 'desc') {
                sortByPrice = 'asc';
                btn.textContent = 'Price ↑';
                btn.classList.add('active');
            } else {
                sortByPrice = 'desc';
                btn.textContent = 'Price ↓';
                btn.classList.add('active');
            }
            renderGallery();
        }

        function setFilter(f) {
            activeFilter = f;
            activeCat = '';
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            event.currentTarget.classList.add('active');
            renderGallery();
        }

        function setCat(cat) {
            activeCat = activeCat === cat ? '' : cat;
            activeFilter = 'all';
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            document.querySelector('.filter-btn').classList.add('active'); // re-activate "All"
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            if (activeCat) event.currentTarget.classList.add('active');
            renderGallery();
        }

        function renderGallery() {
            let data = allPieces.slice();

            if (activeFilter !== 'all') {
                data = data.filter(p => pieceStatus(p) === activeFilter);
            }
            if (activeCat) {
                data = data.filter(p => inferCategory(p) === activeCat);
            }

            if (sortByPrice) {
                const available = data.filter(p => pieceStatus(p) === 'available');
                const rest = data.filter(p => pieceStatus(p) !== 'available');
                available.sort((a, b) => {
                    const pa = parseFloat(a.suggestedPrice) || 0;
                    const pb = parseFloat(b.suggestedPrice) || 0;
                    return sortByPrice === 'asc' ? pa - pb : pb - pa;
                });
                data = [...available, ...rest];
            } else {
                // Sort: available first, then gifted, then others
                const statusOrder = { available: 0, other: 1, sold: 2, gifted: 3 };
                data.sort((a, b) => {
                    const sa = statusOrder[pieceStatus(a)] ?? 9;
                    const sb = statusOrder[pieceStatus(b)] ?? 9;
                    if (sa !== sb) return sa - sb;
                    return (b.dateStart || '').localeCompare(a.dateStart || '');
                });
            }

            pieces = data;
            const gallery = document.getElementById('gallery');
            const count = document.getElementById('piece-count');
            count.textContent = `${pieces.length} piece${pieces.length !== 1 ? 's' : ''}`;
            gallery.innerHTML = '';

            if (pieces.length === 0) {
                gallery.innerHTML = '<div class="loading">No pieces found.</div>';
                return;
            }

            pieces.forEach((piece, i) => {
                const div = document.createElement('div');
                div.className = 'piece';
                div.onclick = () => openLightbox(i);

                const imgHtml = piece.mainImage
                    ? `<img src="${enc(piece.mainImage)}" alt="${piece.name}" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'piece-no-image',textContent:'no photo yet'}))">`
                    : `<div class="piece-no-image">no photo yet</div>`;

                div.innerHTML = `
                    <div class="piece-img-wrap">${imgHtml}</div>
                    <div class="piece-info">
                        <div class="piece-name">${piece.name}</div>
                        ${getPriceLabel(piece, true)}
                    </div>
                `;
                gallery.appendChild(div);
            });
        }

        let slideIdx = 0;
        let slidePhotos = [];

        function openLightbox(i) {
            const piece = pieces[i];
            const body = document.getElementById('lightbox-body');
            slidePhotos = piece.progressPhotos || [];
            slideIdx = 0;

            const progressHtml = slidePhotos.length > 0
                ? `<div class="lightbox-progress">
                    <div class="lightbox-progress-label">Progress photos</div>
                    <div class="progress-slideshow">
                        <div class="progress-slide" id="progressSlide">
                            <img id="progressImg" src="${enc(slidePhotos[0])}" alt="progress" onclick="openImgOverlay(document.getElementById('progressImg').src)" loading="lazy">
                            ${slidePhotos.length > 1 ? `
                            <button class="progress-nav progress-nav-prev" onclick="slideNav(-1)">&#8249;</button>
                            <button class="progress-nav progress-nav-next" onclick="slideNav(1)">&#8250;</button>` : ''}
                        </div>
                        ${slidePhotos.length > 1 ? `
                        <div class="progress-dots" id="progressDots">
                            ${slidePhotos.map((_,j) => `<button class="progress-dot${j===0?' active':''}" onclick="goSlide(${j})"></button>`).join('')}
                        </div>
                        <div class="progress-counter" id="progressCounter">1 / ${slidePhotos.length}</div>` : ''}
                    </div>
                   </div>`
                : '';

            body.innerHTML = `
                <img class="lightbox-main-img" src="${enc(piece.mainImage)}" alt="${piece.name}">
                <div class="lightbox-info">
                    <div class="lightbox-name">${piece.name}</div>
                    ${getPriceLabel(piece, false)}
                    ${piece.suggestedPrice && piece.description ? `<div class="lightbox-desc">${piece.description}</div>` : ''}
                    <div class="lightbox-meta">
                        ${piece.clay  ? `<span>${piece.clay}</span>`  : ''}
                    </div>
                    ${progressHtml}
                </div>
            `;

            document.getElementById('lightbox').classList.add('active');
            document.getElementById('lightbox').scrollTop = 0;
            document.body.style.overflow = 'hidden';
        }

        function goSlide(j) {
            slideIdx = j;
            const img = document.getElementById('progressImg');
            if (img) img.src = enc(slidePhotos[slideIdx]);
            const counter = document.getElementById('progressCounter');
            if (counter) counter.textContent = `${slideIdx + 1} / ${slidePhotos.length}`;
            document.querySelectorAll('.progress-dot').forEach((d, k) =>
                d.classList.toggle('active', k === slideIdx));
        }

        function slideNav(dir) {
            goSlide((slideIdx + dir + slidePhotos.length) % slidePhotos.length);
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
            document.body.style.overflow = '';
        }

        function openImgOverlay(src) {
            document.getElementById('imgOverlayImg').src = src;
            document.getElementById('imgOverlay').classList.add('active');
        }

        function closeImgOverlay() {
            document.getElementById('imgOverlay').classList.remove('active');
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') {
                closeImgOverlay();
                closeLightbox();
            }
        });

        fetch('pottery-data.json')
            .then(r => r.json())
            .then(data => {
                // Only show pieces with PNG main image
                allPieces = data.filter(p =>
                    (p.mainImage || '').match(/\.png$/i) ||
                    (p.progressPhotos || []).some(ph => (ph || '').match(/\.png$/i))
                );

                // Build category filter buttons
                const cats = [...new Set(allPieces.map(p => inferCategory(p)))].sort();
                const bar = document.getElementById('filter-bar');
                cats.forEach(cat => {
                    const btn = document.createElement('button');
                    btn.className = 'filter-btn cat-btn';
                    btn.textContent = cat;
                    btn.onclick = () => setCat(cat);
                    bar.appendChild(btn);
                });

                renderGallery();
            })
            .catch(() => {
                document.getElementById('gallery').innerHTML =
                    '<div class="loading">Could not load pieces.</div>';
            });
    </script>
</body>
</html>
