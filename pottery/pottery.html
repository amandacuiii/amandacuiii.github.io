<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pottery Progress — Amanda Cui</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Neuton:wght@300;400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f9f6f2;
            --text: #3d2e1c;
            --accent: #664930;
            --muted: #9b8472;
            --font: 'Neuton', serif;
            --font-heading: 'Neuton', serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        a { text-decoration: none; color: inherit; }

        nav {
            position: fixed; top: 0; left: 0; right: 0; z-index: 50;
            height: 56px; display: flex; align-items: center; padding: 0 2.5rem;
            background: rgba(249,246,242,0.85); backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .nav-name {
            font-family: var(--font-heading); font-size: 0.9rem;
            font-weight: 500; letter-spacing: 0.08em; transition: color 0.2s;
        }

        .nav-name:hover { color: var(--accent); }

        .page-header {
            padding: 5.5rem 6vw 2.5rem;
        }

        .page-header h1 {
            font-family: var(--font-heading);
            font-size: clamp(2rem, 5vw, 4rem);
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .page-header p {
            margin-top: 0.75rem;
            font-size: 1rem;
            color: var(--muted);
            max-width: 44ch;
            line-height: 1.6;
        }

        .piece-count {
            display: inline-block;
            margin-top: 1rem;
            font-size: 0.8rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .event-link {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            margin-top: 1.25rem;
            padding: 0.5rem 1.1rem;
            border: 1px solid var(--accent);
            border-radius: 2px;
            font-size: 0.8rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--accent);
            transition: background 0.2s, color 0.2s;
        }

        .event-link:hover {
            background: var(--accent);
            color: #f9f6f2;
        }

        /* Gallery grid — aligned square grid */
        .gallery {
            padding: 0 6vw 6rem;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }

        .piece {
            cursor: default;
        }

        .piece-img-wrap {
            position: relative;
            overflow: hidden;
            aspect-ratio: 1 / 1;
            background: var(--bg);
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .piece-img-wrap img {
            height: 65%;
            width: auto;
            max-width: 90%;
            display: block;
            mix-blend-mode: multiply;
            transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .piece-img-wrap img[data-no-image],
        .piece-no-image {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background: #ede8e1;
            color: var(--muted);
            font-size: 0.72rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .piece:hover .piece-img-wrap img {
            transform: scale(1.25);
        }

        .piece-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-family: var(--font-heading);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .badge-complete    { background: rgba(200,232,200,0.9); color: #2a6030; }
        .badge-available   { background: rgba(168,208,208,0.9); color: #2a6060; }
        .badge-in-progress { background: rgba(236,224,192,0.9); color: #705020; }
        .badge-throwing    { background: rgba(212,232,240,0.9); color: #2a6080; }
        .badge-trimming    { background: rgba(220,232,208,0.9); color: #3a6030; }
        .badge-leatherhard { background: rgba(236,224,192,0.9); color: #705020; }
        .badge-bonedry     { background: rgba(232,224,208,0.9); color: #605040; }
        .badge-bisque      { background: rgba(232,196,168,0.9); color: #9e5438; }
        .badge-glazed      { background: rgba(168,208,208,0.9); color: #2a6060; }

        .piece-info {
            padding: 10px 2px 4px;
        }

        .piece-name {
            font-family: var(--font-heading);
            font-size: 0.88rem;
            font-weight: 500;
            color: var(--text);
        }

        .piece-home {
            font-size: 0.78rem;
            color: var(--muted);
            margin-top: 2px;
        }

        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(20, 12, 5, 0.97);
            z-index: 200;
            overflow-y: auto;
        }

        .lightbox.active { display: block; }

        .lightbox-close {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            color: rgba(255,255,255,0.6);
            font-size: 1.8rem;
            cursor: pointer;
            z-index: 201;
            line-height: 1;
            transition: color 0.2s;
            width: 2.5rem;
            height: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lightbox-close:hover { color: #fff; }

        .lightbox-body {
            max-width: 960px;
            margin: 0 auto;
            padding: 4rem 2rem 5rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            align-items: start;
        }

        .lightbox-main-img {
            width: 100%;
            height: auto;
            display: block;
        }

        .lightbox-info {
            color: #f9f6f2;
            padding-top: 0.5rem;
        }

        .lightbox-number {
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: rgba(249,246,242,0.45);
            margin-bottom: 0.75rem;
        }

        .lightbox-name {
            font-family: var(--font-heading);
            font-size: clamp(1.5rem, 3vw, 2.5rem);
            font-weight: 500;
            line-height: 1.1;
            margin-bottom: 1rem;
        }

        .lightbox-desc {
            font-size: 0.95rem;
            line-height: 1.7;
            color: rgba(249,246,242,0.7);
            margin-bottom: 1.25rem;
        }

        .lightbox-home {
            font-size: 0.8rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: rgba(249,246,242,0.4);
        }

        .lightbox-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.75rem;
        }

        .lightbox-meta span {
            font-size: 0.72rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: rgba(249,246,242,0.45);
            background: rgba(255,255,255,0.07);
            padding: 3px 10px;
            border-radius: 20px;
        }

        .lightbox-progress {
            margin-top: 2rem;
        }

        .lightbox-progress-label {
            font-size: 0.7rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: rgba(249,246,242,0.35);
            margin-bottom: 0.75rem;
        }

        /* Slideshow */
        .progress-slideshow {
            position: relative;
        }

        .progress-slide {
            position: relative;
            background: rgba(255,255,255,0.04);
            cursor: pointer;
        }

        .progress-slide img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
            transition: opacity 0.2s;
        }

        .progress-slide img:hover { opacity: 0.9; }

        .progress-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.45);
            border: none;
            color: rgba(255,255,255,0.8);
            font-size: 1.2rem;
            padding: 0.4rem 0.7rem;
            cursor: pointer;
            transition: background 0.2s;
            z-index: 2;
            line-height: 1;
        }

        .progress-nav:hover { background: rgba(0,0,0,0.7); color: #fff; }
        .progress-nav-prev { left: 0; }
        .progress-nav-next { right: 0; }

        .progress-counter {
            text-align: center;
            margin-top: 0.4rem;
            font-size: 0.68rem;
            letter-spacing: 0.12em;
            color: rgba(249,246,242,0.3);
        }

        .progress-dots {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-top: 0.5rem;
        }

        .progress-dot {
            width: 5px; height: 5px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            cursor: pointer;
            transition: background 0.2s;
            border: none;
            padding: 0;
        }

        .progress-dot.active { background: rgba(255,255,255,0.7); }

        /* Full image overlay */
        .img-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.97);
            z-index: 300;
            align-items: center;
            justify-content: center;
        }

        .img-overlay.active { display: flex; }

        .img-overlay img {
            max-width: 92vw;
            max-height: 92vh;
            object-fit: contain;
        }

        .img-overlay-close {
            position: fixed;
            top: 1.5rem; right: 1.5rem;
            color: rgba(255,255,255,0.6);
            font-size: 1.8rem;
            cursor: pointer;
            z-index: 301;
            transition: color 0.2s;
        }

        .img-overlay-close:hover { color: #fff; }

        /* Loading */
        .loading {
            padding: 5rem 6vw;
            color: var(--muted);
            font-size: 0.9rem;
        }

        @media (max-width: 900px) {
            .lightbox-body { grid-template-columns: 1fr; gap: 1.5rem; }
        }

        @media (max-width: 750px) {
            nav { padding: 0 1.25rem; }
            .page-header { padding: 4.5rem 5vw 2rem; }
            .gallery { grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 0 3vw 4rem; }
            .lightbox-body { padding: 3rem 1.25rem 4rem; }
            .lightbox-close { top: 1rem; right: 1rem; }
        }

        @media (max-width: 480px) {
            .gallery { grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 0 2vw 4rem; }
            .piece-name { font-size: 0.78rem; }
            .piece-home { font-size: 0.7rem; }
            .lightbox-body { padding: 2.5rem 1rem 3rem; }
            .lightbox-name { font-size: 1.4rem; }
        }
    </style>
</head>
<body>
    <nav><a href="../Title%20Page/" class="nav-name">Amanda Cui</a></nav>

    <div class="page-header">
        <h1>pottery progress</h1>
        <p>Liminal: A Record of Creation In Between Stages</p>
        <span class="piece-count" id="piece-count"></span>
        <br>
        <a class="event-link" href="https://luma.com/j22ron9z" target="_blank" rel="noopener">
            ✦ Pottery event — RSVP
        </a>
    </div>

    <div class="gallery" id="gallery">
        <div class="loading">Loading pieces...</div>
    </div>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox" onclick="if(event.target.id==='lightbox')closeLightbox()">
        <span class="lightbox-close" onclick="closeLightbox()">&#215;</span>
        <div class="lightbox-body" id="lightbox-body"></div>
    </div>

    <!-- Full image overlay -->
    <div class="img-overlay" id="imgOverlay" onclick="closeImgOverlay()">
        <span class="img-overlay-close" onclick="closeImgOverlay()">&#215;</span>
        <img id="imgOverlayImg" src="" alt="">
    </div>

    <script>
        let pieces = [];

        const STAGE_MAP = {
            'throwing':    { cls: 'badge-throwing',    label: 'Throwing' },
            'trimming':    { cls: 'badge-trimming',    label: 'Trimming' },
            'leatherhard': { cls: 'badge-leatherhard', label: 'Leather Hard' },
            'leather hard':{ cls: 'badge-leatherhard', label: 'Leather Hard' },
            'bone dry':    { cls: 'badge-bonedry',     label: 'Bone Dry' },
            'bonedry':     { cls: 'badge-bonedry',     label: 'Bone Dry' },
            'bisque':      { cls: 'badge-bisque',      label: 'Bisque' },
            'glazed':      { cls: 'badge-glazed',      label: 'Glazed' },
            'complete':    { cls: 'badge-complete',    label: 'Complete' },
        };

        function getBadge(home) {
            if (!home) return null;
            const h = home.toLowerCase().trim();
            if (STAGE_MAP[h]) return STAGE_MAP[h];
            if (h.includes('available') || h.includes('for sale')) return { cls: 'badge-available', label: 'Available' };
            return { cls: 'badge-complete', label: home };
        }

        function enc(p) {
            if (!p) return '';
            // Don't encode base64 data URLs or already-encoded URLs
            if (p.startsWith('data:') || p.startsWith('http')) return p;
            return p.split('/').map(s => encodeURIComponent(s)).join('/');
        }

        const STAGE_ORDER = {
            'complete': 0,
            'available': 1,
            'for sale': 1,
            'glazed': 2,
            'bisque': 3,
            'bone dry': 4,
            'bonedry': 4,
            'leatherhard': 5,
            'leather hard': 5,
            'trimming': 6,
            'throwing': 7,
            'in-progress': 8,
        };

        function stageRank(piece) {
            const h = (piece.home || piece.stage || '').toLowerCase().trim();
            if (h in STAGE_ORDER) return STAGE_ORDER[h];
            if (h.includes('available') || h.includes('for sale')) return 1;
            if (h.includes('complete')) return 0;
            return 9;
        }

        function buildGallery(data) {
            // Only show pieces with background-removed (PNG) photos
            data = data.filter(p =>
                (p.mainImage || '').match(/\.png$/i) ||
                (p.progressPhotos || []).some(ph => (ph || '').match(/\.png$/i))
            );

            // Sort oldest → newest to assign numbers
            data.sort((a, b) => {
                const da = a.dateStart || '';
                const db = b.dateStart || '';
                if (da && db) return da.localeCompare(db);
                if (da) return -1;
                if (db) return 1;
                return (a.createdAt || 0) - (b.createdAt || 0);
            });
            // Assign sequential numbers (oldest = 1)
            data.forEach((p, i) => p._num = i + 1);
            // Sort by stage (complete first), then newest first within each stage
            data.sort((a, b) => {
                const stageDiff = stageRank(a) - stageRank(b);
                if (stageDiff !== 0) return stageDiff;
                const da = a.dateStart || '';
                const db = b.dateStart || '';
                return db.localeCompare(da); // newest first within same stage
            });
            pieces = data;
            const gallery = document.getElementById('gallery');
            const count = document.getElementById('piece-count');
            count.textContent = `${pieces.length} pieces`;
            gallery.innerHTML = '';

            pieces.forEach((piece, i) => {
                const div = document.createElement('div');
                div.className = 'piece';

                const badge = getBadge(piece.home);

                const imgHtml = piece.mainImage
                    ? `<img src="${enc(piece.mainImage)}" alt="${piece.name}" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'piece-no-image',textContent:'no photo yet'}))">`
                    : `<div class="piece-no-image">no photo yet</div>`;

                div.innerHTML = `
                    <div class="piece-img-wrap">
                        ${imgHtml}
                    </div>
                    <div class="piece-info">
                        <div class="piece-name">${piece.name}</div>
                        ${piece.home ? `<div class="piece-home">${piece.home}</div>` : ''}
                    </div>
                `;
                gallery.appendChild(div);
            });
        }

        let slideIdx = 0;
        let slidePhotos = [];

        function openLightbox(i) {
            const piece = pieces[i];
            const body = document.getElementById('lightbox-body');
            slidePhotos = piece.progressPhotos || [];
            slideIdx = 0;

            const progressHtml = slidePhotos.length > 0
                ? `<div class="lightbox-progress">
                    <div class="lightbox-progress-label">Progress photos</div>
                    <div class="progress-slideshow">
                        <div class="progress-slide" id="progressSlide">
                            <img id="progressImg" src="${enc(slidePhotos[0])}" alt="progress" onclick="openImgOverlay(document.getElementById('progressImg').src)" loading="lazy">
                            ${slidePhotos.length > 1 ? `
                            <button class="progress-nav progress-nav-prev" onclick="slideNav(-1)">&#8249;</button>
                            <button class="progress-nav progress-nav-next" onclick="slideNav(1)">&#8250;</button>` : ''}
                        </div>
                        ${slidePhotos.length > 1 ? `
                        <div class="progress-dots" id="progressDots">
                            ${slidePhotos.map((_,j) => `<button class="progress-dot${j===0?' active':''}" onclick="goSlide(${j})"></button>`).join('')}
                        </div>
                        <div class="progress-counter" id="progressCounter">1 / ${slidePhotos.length}</div>` : ''}
                    </div>
                   </div>`
                : '';

            body.innerHTML = `
                <img class="lightbox-main-img" src="${enc(piece.mainImage)}" alt="${piece.name}">
                <div class="lightbox-info">
                    <div class="lightbox-number">No. ${String(piece._num).padStart(2, '0')}</div>
                    <div class="lightbox-name">${piece.name}</div>
                    ${piece.description ? `<div class="lightbox-desc">${piece.description}</div>` : ''}
                    <div class="lightbox-meta">
                        ${piece.stage ? `<span>${piece.stage}</span>` : ''}
                        ${piece.clay  ? `<span>${piece.clay}</span>`  : ''}
                        ${piece.home  ? `<span>${piece.home}</span>`  : ''}
                    </div>
                    ${progressHtml}
                </div>
            `;

            document.getElementById('lightbox').classList.add('active');
            document.getElementById('lightbox').scrollTop = 0;
            document.body.style.overflow = 'hidden';
        }

        function goSlide(j) {
            slideIdx = j;
            const img = document.getElementById('progressImg');
            if (img) img.src = enc(slidePhotos[slideIdx]);
            const counter = document.getElementById('progressCounter');
            if (counter) counter.textContent = `${slideIdx + 1} / ${slidePhotos.length}`;
            document.querySelectorAll('.progress-dot').forEach((d, k) =>
                d.classList.toggle('active', k === slideIdx));
        }

        function slideNav(dir) {
            goSlide((slideIdx + dir + slidePhotos.length) % slidePhotos.length);
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
            document.body.style.overflow = '';
        }

        function openImgOverlay(src) {
            document.getElementById('imgOverlayImg').src = src;
            document.getElementById('imgOverlay').classList.add('active');
        }

        function closeImgOverlay() {
            document.getElementById('imgOverlay').classList.remove('active');
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') {
                closeImgOverlay();
                closeLightbox();
            }
        });

        fetch('pottery-data.json')
            .then(r => r.json())
            .then(buildGallery)
            .catch(() => {
                document.getElementById('gallery').innerHTML =
                    '<div class="loading">Could not load pieces.</div>';
            });
    </script>
</body>
</html>
