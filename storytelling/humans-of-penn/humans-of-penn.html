<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Humans of Penn — Amanda Cui</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Neuton:wght@300;400;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #0d0d0d; color: #f2ede8; font-family: 'Neuton', serif; overflow: hidden; }

    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      height: 56px; display: flex; align-items: center;
      justify-content: space-between; padding: 0 2rem;
      background: rgba(13,13,13,0.9); backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(242,237,232,0.07);
    }
    .nav-name { font-size: .88rem; font-weight: 500; letter-spacing: .08em; text-decoration: none; color: inherit; transition: color .2s; }
    .nav-name:hover { color: #c8a882; }
    .nav-label { font-size: .72rem; letter-spacing: .18em; text-transform: uppercase; color: rgba(242,237,232,0.3); }

    .booklet-wrap {
      height: 100vh; height: 100svh; padding-top: 56px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }

    #booklet-container {
      flex: 1; width: 100%; min-height: 0;
      display: flex; align-items: center; justify-content: center;
      padding: 1.5rem 1rem 0;
    }

    #booklet { display: none; }
    .page img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .booklet-nav {
      display: flex; align-items: center; gap: 1.5rem;
      padding: 1.2rem 0 1.5rem; flex-shrink: 0;
    }
    .booklet-btn {
      background: none; border: 1px solid rgba(242,237,232,0.2);
      color: #f2ede8; font-family: 'Neuton', serif;
      font-size: .72rem; letter-spacing: .15em; text-transform: uppercase;
      padding: .45rem 1.1rem; cursor: pointer; border-radius: 3px;
      transition: border-color .2s, background .2s;
    }
    .booklet-btn:hover { border-color: rgba(242,237,232,0.5); background: rgba(242,237,232,0.05); }
    .booklet-btn:disabled { opacity: 0.2; cursor: default; pointer-events: none; }
    .page-indicator {
      font-size: .72rem; letter-spacing: .12em;
      color: rgba(242,237,232,0.35); min-width: 70px; text-align: center;
    }

    #loading-msg {
      font-size: .75rem; letter-spacing: .18em; text-transform: uppercase;
      color: rgba(242,237,232,0.3); position: absolute;
    }
  </style>
</head>
<body>

<nav>
  <a href="../storytelling.html" class="nav-name">Amanda Cui</a>
  <span class="nav-label">Humans of Penn</span>
</nav>

<div class="booklet-wrap">
  <div id="booklet-container">
    <div id="booklet">
      <div class="page"><img src="pages/page-001.jpg" alt="Page 1"></div>
      <div class="page"><img src="pages/page-002.jpg" alt="Page 2" loading="lazy"></div>
      <div class="page"><img src="pages/page-003.jpg" alt="Page 3" loading="lazy"></div>
      <div class="page"><img src="pages/page-004.jpg" alt="Page 4" loading="lazy"></div>
      <div class="page"><img src="pages/page-005.jpg" alt="Page 5" loading="lazy"></div>
      <div class="page"><img src="pages/page-006.jpg" alt="Page 6" loading="lazy"></div>
      <div class="page"><img src="pages/page-007.jpg" alt="Page 7" loading="lazy"></div>
      <div class="page"><img src="pages/page-008.jpg" alt="Page 8" loading="lazy"></div>
      <div class="page"><img src="pages/page-009.jpg" alt="Page 9" loading="lazy"></div>
      <div class="page"><img src="pages/page-010.jpg" alt="Page 10" loading="lazy"></div>
      <div class="page"><img src="pages/page-011.jpg" alt="Page 11" loading="lazy"></div>
      <div class="page"><img src="pages/page-012.jpg" alt="Page 12" loading="lazy"></div>
      <div class="page"><img src="pages/page-013.jpg" alt="Page 13" loading="lazy"></div>
      <div class="page"><img src="pages/page-014.jpg" alt="Page 14" loading="lazy"></div>
      <div class="page"><img src="pages/page-015.jpg" alt="Page 15" loading="lazy"></div>
      <div class="page"><img src="pages/page-016.jpg" alt="Page 16" loading="lazy"></div>
      <div class="page"><img src="pages/page-017.jpg" alt="Page 17" loading="lazy"></div>
      <div class="page"><img src="pages/page-018.jpg" alt="Page 18" loading="lazy"></div>
      <div class="page"><img src="pages/page-019.jpg" alt="Page 19" loading="lazy"></div>
      <div class="page"><img src="pages/page-020.jpg" alt="Page 20" loading="lazy"></div>
      <div class="page"><img src="pages/page-021.jpg" alt="Page 21" loading="lazy"></div>
      <div class="page"><img src="pages/page-022.jpg" alt="Page 22" loading="lazy"></div>
    </div>
    <span id="loading-msg">Loading booklet…</span>
  </div>
  <div class="booklet-nav">
    <button class="booklet-btn" id="btn-prev" disabled onclick="pageFlip.flipPrev()">← Prev</button>
    <span class="page-indicator" id="page-num"></span>
    <button class="booklet-btn" id="btn-next" disabled onclick="pageFlip.flipNext()">Next →</button>
  </div>
</div>

<script src="https://unpkg.com/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script>
  const containerEl = document.getElementById('booklet-container');
  const loadingEl   = document.getElementById('loading-msg');
  const total       = 22;

  // Page dimensions: 1577×2041pt rendered at 800px wide
  const nativeW = 1577, nativeH = 2041;
  const aspect  = nativeH / nativeW;

  function calcSize() {
    const cw = containerEl.clientWidth;
    const ch = containerEl.clientHeight;
    const maxW = Math.min(Math.floor(cw / 2) - 24, 460);
    const maxH = ch - 8;
    const w = Math.min(maxW, Math.floor(maxH / aspect));
    return { w, h: Math.round(w * aspect) };
  }

  const { w: pageW, h: pageH } = calcSize();

  const pageFlip = new St.PageFlip(document.getElementById('booklet'), {
    width: pageW, height: pageH,
    size: 'fixed',
    drawShadow: true,
    flippingTime: 700,
    usePortrait: true,
    showPageCorners: true,
    mobileScrollSupport: false,
    swipeDistance: 40,
  });

  const firstImg = document.querySelector('.page img');
  function init() {
    loadingEl.style.display = 'none';
    pageFlip.loadFromHTML(document.querySelectorAll('.page'));
    function updateNav(idx) {
      document.getElementById('page-num').textContent = `${idx + 1} / ${total}`;
      document.getElementById('btn-prev').disabled = idx <= 0;
      document.getElementById('btn-next').disabled = idx >= total - 1;
    }
    pageFlip.on('flip', e => updateNav(e.data));
    updateNav(0);
    document.getElementById('btn-prev').disabled = false;
    document.getElementById('btn-next').disabled = false;
  }

  if (firstImg.complete) {
    init();
  } else {
    firstImg.addEventListener('load', init);
    firstImg.addEventListener('error', () => {
      loadingEl.innerHTML = '<a style="color:#c8a882;text-decoration:underline" href="S23%20FinalZine.pdf" target="_blank">Open PDF</a>';
    });
  }
</script>
</body>
</html>
