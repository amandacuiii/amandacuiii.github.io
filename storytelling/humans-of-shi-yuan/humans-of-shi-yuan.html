<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Humans of Shi Yuan — Amanda Cui</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Neuton:wght@300;400;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #0d0d0d; color: #f2ede8; font-family: 'Neuton', serif; overflow: hidden; }

    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      height: 56px; display: flex; align-items: center;
      justify-content: space-between; padding: 0 2rem;
      background: rgba(13,13,13,0.9); backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(242,237,232,0.07);
    }
    .nav-name { font-size: .88rem; font-weight: 500; letter-spacing: .08em; text-decoration: none; color: inherit; transition: color .2s; }
    .nav-name:hover { color: #c8a882; }
    .nav-label { font-size: .72rem; letter-spacing: .18em; text-transform: uppercase; color: rgba(242,237,232,0.3); }

    .booklet-wrap {
      height: 100vh; padding-top: 56px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }

    #booklet-container {
      flex: 1; width: 100%; min-height: 0;
      display: flex; align-items: center; justify-content: center;
      padding: 1.5rem 1rem 0;
    }

    .booklet-nav {
      display: flex; align-items: center; gap: 1.5rem;
      padding: 1.2rem 0 1.5rem; flex-shrink: 0;
    }
    .booklet-btn {
      background: none; border: 1px solid rgba(242,237,232,0.2);
      color: #f2ede8; font-family: 'Neuton', serif;
      font-size: .72rem; letter-spacing: .15em; text-transform: uppercase;
      padding: .45rem 1.1rem; cursor: pointer; border-radius: 3px;
      transition: border-color .2s, background .2s;
    }
    .booklet-btn:hover { border-color: rgba(242,237,232,0.5); background: rgba(242,237,232,0.05); }
    .booklet-btn:disabled { opacity: 0.2; cursor: default; pointer-events: none; }
    .page-indicator {
      font-size: .72rem; letter-spacing: .12em;
      color: rgba(242,237,232,0.35); min-width: 70px; text-align: center;
    }

    #loading-msg {
      font-size: .75rem; letter-spacing: .18em; text-transform: uppercase;
      color: rgba(242,237,232,0.3); position: absolute;
    }
  </style>
</head>
<body>

<nav>
  <a href="../storytelling.html" class="nav-name">Amanda Cui</a>
  <span class="nav-label">Humans of Shi Yuan</span>
</nav>

<div class="booklet-wrap">
  <div id="booklet-container">
    <div id="booklet"></div>
    <span id="loading-msg">Loading booklet…</span>
  </div>
  <div class="booklet-nav">
    <button class="booklet-btn" id="btn-prev" disabled onclick="pageFlip.flipPrev()">← Prev</button>
    <span class="page-indicator" id="page-num"></span>
    <button class="booklet-btn" id="btn-next" disabled onclick="pageFlip.flipNext()">Next →</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  let pageFlip;

  (async function () {
    const loadingEl = document.getElementById('loading-msg');
    const containerEl = document.getElementById('booklet-container');

    try {
      const pdf = await pdfjsLib.getDocument('Humans%20of%20Shi%20Yuan.pdf').promise;
      const total = pdf.numPages;

      const firstPage = await pdf.getPage(1);
      const vp0 = firstPage.getViewport({ scale: 1 });
      const aspect = vp0.height / vp0.width;

      const cw = containerEl.clientWidth;
      const ch = containerEl.clientHeight;
      const maxPageW = Math.min(Math.floor(cw / 2) - 24, 460);
      const maxPageH = ch - 8;
      const pageW = Math.min(maxPageW, Math.floor(maxPageH / aspect));
      const pageH = Math.round(pageW * aspect);

      pageFlip = new St.PageFlip(document.getElementById('booklet'), {
        width: pageW, height: pageH,
        size: 'fixed',
        drawShadow: true,
        flippingTime: 700,
        usePortrait: true,
        showPageCorners: true,
        mobileScrollSupport: false,
        swipeDistance: 40,
      });

      const scale = Math.max(1.5, (pageW / vp0.width) * window.devicePixelRatio);
      const images = [];

      for (let i = 1; i <= total; i++) {
        loadingEl.textContent = `Loading ${i} / ${total}…`;
        const page = await pdf.getPage(i);
        const viewport = page.getViewport({ scale });
        const canvas = document.createElement('canvas');
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
        images.push(canvas.toDataURL('image/jpeg', 0.88));
      }

      loadingEl.style.display = 'none';
      pageFlip.loadFromImages(images);

      function updateNav(idx) {
        document.getElementById('page-num').textContent = `${idx + 1} / ${total}`;
        document.getElementById('btn-prev').disabled = idx <= 0;
        document.getElementById('btn-next').disabled = idx >= total - 1;
      }

      pageFlip.on('flip', e => updateNav(e.data));
      updateNav(0);
      document.getElementById('btn-prev').disabled = false;
      document.getElementById('btn-next').disabled = false;

    } catch (e) {
      loadingEl.innerHTML = '<a style="color:#c8a882;text-decoration:underline" href="Humans%20of%20Shi%20Yuan.pdf" target="_blank">Open PDF</a>';
    }
  })();
</script>
</body>
</html>
