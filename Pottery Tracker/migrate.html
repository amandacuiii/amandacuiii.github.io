<head>

  <style>
    body { font-family: -apple-system, sans-serif; background: #fdf6ee; color: #4a3728;
           display: flex; flex-direction: column; align-items: center; justify-content: center;

    h2   { font-size: 1.3rem; }

    .btn {
      padding: 10px 24px; background: #c2714f; color: #fff; border: none;
      border-radius: 10px; cursor: pointer; font-size: 1rem; font-weight: 600;
      font-family: inherit;
    }
    .btn:hover { background: #9e5438; }
    code { background: #e8c4a8; padding: 1px 6px; border-radius: 4px; font-size: .88rem; }
  </style>
</head>
<body>
  <div style="font-size:3rem">🏺</div>
  <h2 id="title">Restore your pottery data</h2>
  <p id="desc">Click below and select the <code>photos</code> folder inside your Pottery Tracker folder. All your pieces and photos will be restored automatically.</p>

  <div class="bar-wrap" id="barWrap"><div class="bar" id="bar"></div></div>
  <div class="status" id="status"></div>

    async function pickFolder() {
      try {
        const dirHandle = await window.showDirectoryPicker({ mode: 'read' });
        document.getElementById('btn').style.display = 'none';
        document.getElementById('barWrap').style.display = '';
        await migrate(dirHandle);
      } catch(e) {
        if (e.name !== 'AbortError') alert('Something went wrong: ' + e.message);
      }
    }

    function fileToBase64(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = e => resolve(e.target.result);
        reader.onerror = () => resolve(null);
        reader.readAsDataURL(file);
      });
    }

    async function migrate(photosDir) {
      const bar    = document.getElementById('bar');
      const status = document.getElementById('status');

      const total = pieces.reduce((n, p) => n + p.photos.length, 0);
      let done = 0;

      for (const piece of pieces) {
        const base64Photos = [];

        // Try to get this piece's subfolder
        let pieceDir;
        try {
          pieceDir = await photosDir.getDirectoryHandle(piece.id);
        } catch(e) {
          // folder missing — skip photos for this piece
          done += piece.photos.length;
          bar.style.width = (done / total * 100) + '%';
          piece.photos = [];
          continue;
        }

        for (const filename of piece.photos) {
          status.textContent = `${piece.name} — ${filename}`;
          try {
            const fh   = await pieceDir.getFileHandle(filename);
            const file = await fh.getFile();
            const b64  = await fileToBase64(file);
            if (b64) base64Photos.push(b64);
          } catch(e) { /* file missing, skip */ }
          done++;
          bar.style.width = (done / total * 100) + '%';
        }

        piece.photos = base64Photos;
      }

      localStorage.setItem('pottery', JSON.stringify(pieces));
      status.textContent = '✓ All done! Redirecting to your tracker…';
      bar.style.width = '100%';
      setTimeout(() => { window.location.href = 'index.html'; }, 1000);
    }
  </script>
</body>
</html>
