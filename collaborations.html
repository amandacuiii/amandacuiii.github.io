<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ongoing Projects — Amanda Cui</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Neuton:wght@300;400;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: 'Neuton', serif;
      background: #0d0d0d;
      color: #f2ede8;
      -webkit-font-smoothing: antialiased;
    }

    a { text-decoration: none; color: inherit; }

    /* ── Nav ─────────────────────────────────────── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 200;
      height: 56px; display: flex; align-items: center;
      justify-content: space-between; padding: 0 2rem;
      background: rgba(13,13,13,0.9); backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(242,237,232,0.07);
    }
    .nav-name {
      font-size: .88rem; font-weight: 500; letter-spacing: .08em;
      transition: color .2s;
    }
    .nav-name:hover { color: #c8a882; }
    .nav-label {
      font-size: .72rem; letter-spacing: .18em; text-transform: uppercase;
      color: rgba(242,237,232,0.3);
    }

    /* ── Layout ──────────────────────────────────── */
    .layout {
      display: flex;
      height: 100vh;
      padding-top: 56px;
    }

    /* ── Sidebar ─────────────────────────────────── */
    .sidebar {
      width: 340px; flex-shrink: 0;
      display: flex; flex-direction: column; justify-content: center;
      padding: 3rem 2.5rem;
      border-right: 1px solid rgba(242,237,232,0.08);
      overflow-y: auto; gap: 0;
    }

    .sidebar-hint {
      font-size: .6rem; letter-spacing: .2em; text-transform: uppercase;
      color: rgba(242,237,232,0.2); margin-bottom: 2rem;
    }

    .project-item {
      padding: 1.8rem 1rem;
      cursor: pointer;
      border-bottom: 1px solid rgba(242,237,232,0.07);
      opacity: 0.38;
      transition: opacity 0.3s ease, background 0.3s ease;
      user-select: none; position: relative;
      border-radius: 4px; margin: 0 -1rem;
    }
    .project-item:first-of-type { border-top: 1px solid rgba(242,237,232,0.07); }
    .project-item.active { opacity: 1; background: rgba(242,237,232,0.05); }
    .project-item:not(.active):hover { opacity: 0.7; background: rgba(242,237,232,0.03); }

    .project-item::before {
      content: '';
      position: absolute; left: 0; top: 25%; bottom: 25%;
      width: 3px; border-radius: 2px; background: #c8a882;
      opacity: 0; transition: opacity 0.3s ease;
    }
    .project-item.active::before { opacity: 1; }

    .project-item::after {
      content: '→';
      position: absolute; right: 1rem; top: 50%; transform: translateY(-50%);
      font-size: 1rem; color: #c8a882;
      opacity: 0; transition: opacity 0.3s ease;
    }
    .project-item.active::after { opacity: 1; }

    .project-num {
      font-size: .65rem; letter-spacing: .22em; text-transform: uppercase;
      color: rgba(242,237,232,0.35); margin-bottom: .5rem; transition: color 0.3s;
    }
    .project-item.active .project-num { color: #c8a882; }

    .project-title {
      font-size: clamp(1.15rem, 1.8vw, 1.55rem);
      font-weight: 300; line-height: 1.2; letter-spacing: -0.01em;
    }
    .project-meta {
      font-size: .75rem; letter-spacing: .06em;
      color: rgba(242,237,232,0.3); margin-top: .45rem;
    }

    /* ── Content area ────────────────────────────── */
    .content-area {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .project-panel {
      position: absolute; inset: 0;
      opacity: 0; pointer-events: none;
      transition: opacity 0.4s ease;
    }
    .project-panel.active {
      opacity: 1; pointer-events: all;
    }

    /* ── Reel panel ──────────────────────────────── */
    .reel-panel {
      width: 100%; height: 100%;
      overflow-y: auto;
      background: #f9f6f2;
      color: #3d2e1c;
    }

    .reel-panel-inner {
      padding: 3rem 3rem 5rem;
      max-width: 1100px;
      margin: 0 auto;
    }

    .reel-panel-inner h2 {
      font-size: clamp(1.6rem, 3vw, 2.5rem);
      font-weight: 300; letter-spacing: -.02em;
      margin-bottom: .5rem;
    }
    .reel-panel-inner .sub {
      font-size: .9rem; color: #9b8472; margin-bottom: 2.5rem; line-height: 1.6;
    }

    .reel-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
    }

    .reel-card {
      position: relative;
      aspect-ratio: 9 / 16;
      background: #e8e0d8;
      cursor: pointer;
      overflow: hidden;
    }
    .reel-card img {
      width: 100%; height: 100%;
      object-fit: cover; display: block;
      transition: transform .5s cubic-bezier(.25,.46,.45,.94);
    }
    .reel-card.placeholder {
      cursor: default;
      display: flex; align-items: center; justify-content: center;
    }
    .placeholder-label {
      font-family: 'Neuton', serif; font-size: .7rem;
      letter-spacing: .14em; text-transform: uppercase;
      color: #9b8472; opacity: .4;
    }
    .card-overlay {
      position: absolute; inset: 0;
      background: rgba(30,18,8,0);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: .5rem; transition: background .3s ease;
      padding: 1.5rem; text-align: center;
    }
    .reel-card:not(.placeholder):hover .card-overlay { background: rgba(30,18,8,.55); }
    .reel-card:not(.placeholder):hover img { transform: scale(1.05); }
    .play-icon {
      width: 44px; height: 44px;
      border: 2px solid #fff; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transform: scale(.8);
      transition: opacity .3s, transform .3s;
    }
    .play-icon svg { margin-left: 3px; }
    .card-title {
      font-size: .88rem; font-weight: 500;
      color: #fff; letter-spacing: .03em; line-height: 1.3;
      opacity: 0; transform: translateY(6px);
      transition: opacity .3s, transform .3s;
    }
    .card-brand {
      font-size: .72rem; letter-spacing: .1em; text-transform: uppercase;
      color: rgba(255,255,255,.65);
      opacity: 0; transform: translateY(6px);
      transition: opacity .35s .05s, transform .35s .05s;
    }
    .reel-card:not(.placeholder):hover .play-icon  { opacity: 1; transform: scale(1); }
    .reel-card:not(.placeholder):hover .card-title  { opacity: 1; transform: translateY(0); }
    .reel-card:not(.placeholder):hover .card-brand  { opacity: 1; transform: translateY(0); }

    .ig-link {
      display: flex; justify-content: center; padding: 2.5rem 0 0;
    }
    .ig-btn {
      display: inline-flex; align-items: center; gap: .5rem;
      padding: .65rem 1.4rem;
      border: 1.5px solid rgba(102,73,48,.12); border-radius: 8px;
      font-size: .82rem; color: #9b8472;
      transition: border-color .2s, color .2s;
    }
    .ig-btn:hover { border-color: #664930; color: #664930; }

    /* ── Placeholder panel (camp / exhibit) ──────── */
    .placeholder-panel {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 1.2rem;
      position: relative; overflow: hidden;
    }
    .placeholder-panel .bg {
      position: absolute; inset: 0;
      background-size: cover; background-position: center;
      filter: brightness(0.25);
    }
    .placeholder-panel .ph-content {
      position: relative; z-index: 1; text-align: center; padding: 0 2rem;
    }
    .placeholder-panel h2 {
      font-size: clamp(1.6rem, 3vw, 2.8rem);
      font-weight: 300; letter-spacing: -.01em; margin-bottom: .6rem;
    }
    .placeholder-panel .ph-tag {
      font-size: .68rem; letter-spacing: .2em; text-transform: uppercase;
      color: rgba(242,237,232,0.35);
    }
    .placeholder-panel .ph-soon {
      margin-top: 2rem;
      font-size: .7rem; letter-spacing: .18em; text-transform: uppercase;
      color: #c8a882; opacity: .6;
      border: 1px solid rgba(200,168,130,0.25); border-radius: 4px;
      padding: .4rem .9rem; display: inline-block;
    }

    /* ── Modal ───────────────────────────────────── */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.92); z-index: 300;
      align-items: center; justify-content: center; padding: 20px;
    }
    .modal-overlay.open { display: flex; }
    .modal { position: relative; width: 100%; max-width: 420px; }
    .modal-close {
      position: absolute; top: -2.2rem; right: 0;
      color: rgba(255,255,255,.6); font-size: 1.5rem;
      cursor: pointer; line-height: 1;
      transition: color .2s; background: none; border: none;
    }
    .modal-close:hover { color: #fff; }
    .video-frame { width: 100%; aspect-ratio: 9/16; background: #000; }
    .video-frame iframe { width: 100%; height: 100%; border: none; display: block; }
    .modal-info {
      padding: .9rem 0 0;
      display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem;
    }
    .modal-title { font-size: 1rem; font-weight: 500; color: #f9f6f2; }
    .modal-brand { font-size: .8rem; color: rgba(249,246,242,.5); margin-top: .2rem; }
    .modal-ext {
      font-size: .78rem; letter-spacing: .08em; text-transform: uppercase;
      color: rgba(249,246,242,.35); white-space: nowrap;
      transition: color .2s; flex-shrink: 0; margin-top: .15rem;
    }
    .modal-ext:hover { color: rgba(249,246,242,.7); }

    /* ── Mobile ──────────────────────────────────── */
    @media (max-width: 768px) {
      html, body { overflow: hidden; }

      .layout { flex-direction: column; height: 100vh; padding-top: 56px; }

      .sidebar {
        width: 100%; flex-direction: row;
        justify-content: flex-start; align-items: stretch;
        padding: 0; border-right: none;
        border-bottom: 1px solid rgba(242,237,232,0.08);
        overflow-x: auto; overflow-y: hidden;
        flex-shrink: 0; height: 54px;
        scrollbar-width: none;
      }
      .sidebar::-webkit-scrollbar { display: none; }

      .sidebar-hint { display: none; }
      .project-item {
        padding: 0 1.5rem; border-bottom: none; border-radius: 0;
        border-right: 1px solid rgba(242,237,232,0.07);
        border-top: none !important; margin: 0;
        flex-shrink: 0; white-space: nowrap;
        display: flex; flex-direction: column; justify-content: center;
        background: transparent !important;
      }
      .project-item::before {
        left: 50%; top: auto; bottom: 0; right: auto;
        transform: translateX(-50%);
        width: 0; height: 2px; border-radius: 0;
        transition: width 0.35s ease; opacity: 1;
      }
      .project-item.active::before { width: 65%; height: 2px; opacity: 1; }
      .project-item::after { display: none; }
      .project-meta { display: none; }
      .project-num { margin-bottom: .2rem; font-size: .6rem; }
      .project-title { font-size: .95rem; }

      .content-area { flex: 1; overflow: hidden; position: relative; min-height: 0; }
      .project-panel { position: absolute; inset: 0; }

      .reel-panel-inner { padding: 2rem 1.25rem 4rem; }
      .reel-grid { grid-template-columns: repeat(2, 1fr); }

      .placeholder-panel h2 { font-size: clamp(1.3rem, 6vw, 2rem); }
    }

    @media (max-width: 420px) {
      nav { padding: 0 1rem; }
      .reel-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-name">Amanda Cui</a>
  <span class="nav-label">Ongoing Projects</span>
</nav>

<div class="layout">

  <!-- ── Sidebar ──────────────────────────────────── -->
  <aside class="sidebar">

    <div class="sidebar-hint">Select a project</div>

    <div class="project-item active" data-project="camp" onclick="showProject('camp')">
      <div class="project-num">01</div>
      <div class="project-title">Indigenous Pottery Camp</div>
      <div class="project-meta">Taiwan · 2025</div>
    </div>

    <div class="project-item" data-project="exhibit" onclick="showProject('exhibit')">
      <div class="project-num">02</div>
      <div class="project-title">Pottery Exhibit</div>
      <div class="project-meta">Coming soon</div>
    </div>

  </aside>

  <!-- ── Content panels ───────────────────────────── -->
  <main class="content-area">

    <!-- 01 · Indigenous Pottery Camp -->
    <div class="project-panel active" id="panel-camp">
      <div class="placeholder-panel">
        <div class="bg" style="background-image: url('photos/Title Page/taiwan through our eyes /DSC01598.JPG')"></div>
        <div class="ph-content">
          <h2>Indigenous Pottery Camp</h2>
          <div class="ph-tag">Taiwan · 2025</div>
          <div class="ph-soon">Coming soon</div>
        </div>
      </div>
    </div>

    <!-- 03 · Pottery Exhibit -->
    <div class="project-panel" id="panel-exhibit">
      <div class="placeholder-panel">
        <div class="bg" style="background-image: url('photos/Title Page/pottery progress/background.jpeg')"></div>
        <div class="ph-content">
          <h2>Pottery Exhibit</h2>
          <div class="ph-tag">Coming soon</div>
          <div class="ph-soon">Coming soon</div>
        </div>
      </div>
    </div>

  </main>
</div>

<!-- ── Modal ──────────────────────────────────────── -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeReel()">
  <div class="modal">
    <button class="modal-close" onclick="closeReel()">✕</button>
    <div class="video-frame">
      <iframe id="modalIframe" src="" allowfullscreen
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture">
      </iframe>
    </div>
    <div class="modal-info">
      <div>
        <div class="modal-title" id="modalTitle"></div>
        <div class="modal-brand" id="modalBrand"></div>
      </div>
      <a class="modal-ext" id="modalExt" href="" target="_blank">View on Instagram ↗</a>
    </div>
  </div>
</div>

<script>
  function showProject(id) {
    document.querySelectorAll('.project-item').forEach(el =>
      el.classList.toggle('active', el.dataset.project === id)
    );
    document.querySelectorAll('.project-panel').forEach(el =>
      el.classList.toggle('active', el.id === 'panel-' + id)
    );
  }

  function openReel(card) {
    const embed = card.dataset.embed;
    const type  = card.dataset.type || 'instagram';
    document.getElementById('modalIframe').src = type === 'youtube' ? embed + '?autoplay=1' : embed;
    document.getElementById('modalTitle').textContent = card.dataset.title || '';
    document.getElementById('modalBrand').textContent = card.dataset.brand || '';
    const ext = document.getElementById('modalExt');
    ext.href = embed.replace('/embed/', '/').replace('?autoplay=1','');
    ext.textContent = type === 'youtube' ? 'View on YouTube ↗' : 'View on Instagram ↗';
    document.getElementById('modalOverlay').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeReel() {
    document.getElementById('modalOverlay').classList.remove('open');
    document.getElementById('modalIframe').src = '';
    document.body.style.overflow = '';
  }

  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeReel(); });
</script>
</body>
</html>
