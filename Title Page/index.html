<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amanda Cui</title>
    <meta name="description" content="Amanda Cui — visual storyteller working across photography, film, and ceramics. Based in New York.">
    <meta property="og:title" content="Amanda Cui">
    <meta property="og:description" content="Visual storyteller working across photography, film, and ceramics.">
    <meta property="og:url" content="https://amandacui.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Neuton:wght@300;400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --font: 'Neuton', serif;
            --font-heading: 'Neuton', serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            min-height: 100%;
            background: #111;
        }

        a { text-decoration: none; color: inherit; }

        .site-name {
            position: fixed;
            top: 1.5rem;
            left: 2rem;
            z-index: 20;
            font-family: var(--font-heading);
            font-size: 0.95rem;
            font-weight: 500;
            color: #fff;
            letter-spacing: 0.08em;
            text-shadow: 0 1px 6px rgba(0,0,0,0.5);
        }

        .masonry {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: 1fr 1fr;
            gap: 3px;
            padding: 3px;
            height: 100vh;
            height: 100svh;
            background: #111;
        }

        /* Row 1: 3 tiles × 2 cols each = 6 cols */
        .tile:nth-child(1),
        .tile:nth-child(2),
        .tile:nth-child(3) { grid-column: span 2; }

        /* Row 2: 2 tiles × 3 cols each = 6 cols — no gap */
        .tile:nth-child(4),
        .tile:nth-child(5) { grid-column: span 3; }

        .tile {
            position: relative;
            overflow: hidden;
            display: block;
        }

        /* Two stacked images per tile for crossfade */
        .tile img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: opacity 1.2s ease, transform 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .tile img.behind  { opacity: 0; z-index: 1; }
        .tile img.current { opacity: 1; z-index: 2; }

        .tile:hover img.current { transform: scale(1.05); }

        .tile-overlay {
            position: absolute;
            inset: 0;
            z-index: 3;
            background: rgba(0, 0, 0, 0);
            transition: background 0.45s ease;
            display: flex;
            align-items: flex-end;
            padding: 1.5rem;
        }

        .tile:hover .tile-overlay { background: rgba(0, 0, 0, 0.4); }

        .tile-title {
            font-family: var(--font-heading);
            font-size: clamp(0.9rem, 1.4vw, 1.3rem);
            font-weight: 400;
            color: #fff;
            letter-spacing: 0.05em;
            opacity: 0;
            transform: translateY(6px);
            transition: opacity 0.35s ease, transform 0.35s ease;
        }

        .tile:hover .tile-title { opacity: 1; transform: translateY(0); }

        @media (max-width: 700px) {
            .site-name { top: 1rem; left: 1.25rem; font-size: 0.85rem; }
            /* 2-col, 3-row: tile1+2 / tile3 full-width / tile4+5 */
            .masonry {
                grid-template-columns: repeat(2, 1fr);
                grid-template-rows: 1fr 1fr 1fr;
            }
            .masonry .tile { grid-column: span 1; }
            .masonry .tile:nth-child(3) { grid-column: span 2; }
            .tile-title { opacity: 1; transform: none; font-size: 0.85rem; }
            .tile-overlay { background: rgba(0,0,0,0.28); }
        }

        @media (max-width: 430px) {
            /* 1-col, 5-row: each tile fills 1/5 of screen height */
            .masonry {
                grid-template-columns: 1fr;
                grid-template-rows: repeat(5, 1fr);
            }
            .masonry .tile,
            .masonry .tile:nth-child(3) { grid-column: span 1; }
        }
    </style>
</head>
<body>
    <div class="site-name">Amanda Cui</div>

    <div class="masonry">
        <a href="../pottery/exhibition.html" class="tile tile-1" data-tile="pottery">
            <img class="current" src="pottery%20progress/IMG_7218.jpeg" alt="" loading="eager">
            <img class="behind"  src="" alt="">
            <div class="tile-overlay"><div class="tile-title">liminal exhibition</div></div>
        </a>

        <a href="../ongoing%20projects/ongoing-projects.html" class="tile tile-2" data-tile="collaborations">
            <img class="current" src="ongoing%20projects%20/IMG_0312.jpeg" alt="" loading="eager">
            <img class="behind"  src="" alt="">
            <div class="tile-overlay"><div class="tile-title">ongoing projects</div></div>
        </a>

        <a href="../storytelling/storytelling.html" class="tile tile-3" data-tile="storytelling">
            <img class="current" src="storytelling/DSC01357.JPG" alt="" loading="eager">
            <img class="behind"  src="" alt="">
            <div class="tile-overlay"><div class="tile-title">storytelling</div></div>
        </a>

        <a href="../creative%20collaborations/creative-collaborations.html" class="tile tile-4" data-tile="photography">
            <img class="current" src="creative%20collaborations/IMG_0617.jpeg" alt="" loading="eager">
            <img class="behind"  src="" alt="">
            <div class="tile-overlay"><div class="tile-title">creative collaborations</div></div>
        </a>

        <a href="../About%20Me/about.html" class="tile tile-5" data-tile="about">
            <img class="current" src="about/photoshoot-photo.jpg" alt="" loading="eager">
            <img class="behind"  src="" alt="">
            <div class="tile-overlay"><div class="tile-title">about</div></div>
        </a>
    </div>

    <script>
        const PHOTOS = {
            pottery: [
                'pottery%20progress/background.jpeg',
                'pottery%20progress/IMG_6207.jpeg',
                'pottery%20progress/IMG_7218.jpeg',
            ],
            collaborations: [
                'ongoing%20projects%20/IMG_0312.jpeg',
                'ongoing%20projects%20/IMG_0450.jpeg',
                'ongoing%20projects%20/IMG_2695.jpeg',
                'ongoing%20projects%20/IMG_7964.jpeg',
            ],
            storytelling: [
                'storytelling/DSC01357.JPG',
                'storytelling/DSC05037 copy.JPG',
                'storytelling/JPEG image 3.jpeg',
            ],
            photography: [
                'creative%20collaborations/IMG_0617.jpeg',
                'creative%20collaborations/IMG_2461.JPG',
            ],
            about: [
                'about/photoshoot-photo.jpg',
                'about/DSC00855.JPG',
                'about/DSC01178.JPG',
                'about/DSC04855 copy.JPG',
                'about/IMG_3042.jpeg',
            ],
        };

        // Track current index per tile
        const state = {};
        document.querySelectorAll('.tile[data-tile]').forEach(tile => {
            const key = tile.dataset.tile;
            const photos = PHOTOS[key];
            if (!photos || photos.length <= 1) return;

            state[key] = 0;

            function swap() {
                const nextIdx = (state[key] + 1) % photos.length;
                const current = tile.querySelector('img.current');
                const behind  = tile.querySelector('img.behind');
                behind.src = photos[nextIdx];
                behind.onload = () => {
                    behind.classList.replace('behind', 'current');
                    current.classList.replace('current', 'behind');
                    current.style.opacity = '0';
                    behind.style.opacity = '';
                    state[key] = nextIdx;
                };
            }

            tile.addEventListener('mouseenter', swap);
        });
    </script>
</body>
</html>
