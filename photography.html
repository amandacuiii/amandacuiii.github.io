<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photography — Amanda Cui</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Neuton:wght@300;400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f9f6f2;
            --text: #3d2e1c;
            --accent: #664930;
            --muted: #9b8472;
            --font: 'Neuton', serif;
            --font-heading: 'Neuton', serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font); background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
        a { text-decoration: none; color: inherit; }
        nav {
            position: fixed; top: 0; left: 0; right: 0; z-index: 50;
            height: 56px; display: flex; align-items: center; padding: 0 2.5rem;
            background: rgba(249,246,242,0.85); backdrop-filter: blur(12px);
        }
        .nav-name { font-family: var(--font-heading); font-size: 0.9rem; font-weight: 500; letter-spacing: 0.08em; transition: color 0.2s; }
        .nav-name:hover { color: var(--accent); }
        .page-header { padding: 5.5rem 6vw 2.5rem; }
        .page-header h1 { font-family: var(--font-heading); font-size: clamp(2rem,5vw,4rem); font-weight: 700; letter-spacing: -0.02em; }
        .gallery { padding: 0 6vw 6rem; column-count: 4; column-gap: 6px; }
        .gallery-item { display: inline-block; width: 100%; margin-bottom: 6px; break-inside: avoid; cursor: pointer; overflow: hidden; }
        .gallery-item img { width: 100%; height: auto; display: block; transition: opacity 0.3s, transform 0.5s; }
        .gallery-item:hover img { opacity: 0.88; transform: scale(1.02); }
        .lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 200; align-items: center; justify-content: center; }
        .lightbox.active { display: flex; }
        .lightbox img { max-width: 92vw; max-height: 92vh; object-fit: contain; }
        .lightbox-close { position: fixed; top: 1.5rem; right: 1.5rem; color: rgba(255,255,255,0.7); font-size: 1.8rem; cursor: pointer; z-index: 201; transition: color 0.2s; }
        .lightbox-close:hover { color: #fff; }
        .lightbox-nav { position: fixed; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.6); font-size: 2rem; cursor: pointer; padding: 1rem; z-index: 201; transition: color 0.2s; font-family: var(--font-heading); }
        .lightbox-nav:hover { color: #fff; }
        .lightbox-prev { left: 1rem; }
        .lightbox-next { right: 1rem; }
        @media (max-width: 1100px) { .gallery { column-count: 3; } }
        @media (max-width: 750px)  { .gallery { column-count: 2; } }
        @media (max-width: 480px)  { .gallery { column-count: 1; } }
    </style>
</head>
<body>
    <nav><a href="index.html" class="nav-name">Amanda Cui</a></nav>
    <div class="page-header"><h1>Photography</h1></div>
    <div class="gallery" id="gallery"></div>
    <div class="lightbox" id="lightbox" onclick="if(event.target===this)closeLightbox()">
        <span class="lightbox-close" onclick="closeLightbox()">&#215;</span>
        <span class="lightbox-nav lightbox-prev" onclick="navigate(-1)">&#8592;</span>
        <img id="lightbox-img" src="" alt="Photography">
        <span class="lightbox-nav lightbox-next" onclick="navigate(1)">&#8594;</span>
    </div>

    <script>
        const photos = [
            'photos/Sony shots/Alan.JPG','photos/Sony shots/chiangkaishek.JPG',
            'photos/Sony shots/DSC00028.JPG','photos/Sony shots/DSC00042.JPG',
            'photos/Sony shots/DSC00178.JPG','photos/Sony shots/DSC00268.JPG',
            'photos/Sony shots/DSC00269.JPG','photos/Sony shots/DSC00515.JPG',
            'photos/Sony shots/DSC00516.JPG','photos/Sony shots/DSC00653_0.JPG',
            'photos/Sony shots/DSC00968.JPG','photos/Sony shots/DSC01036.JPG',
            'photos/Sony shots/DSC01042.JPG','photos/Sony shots/DSC01215.JPG',
            'photos/Sony shots/DSC01352.JPG','photos/Sony shots/DSC01357.JPG',
            'photos/Sony shots/DSC01413.JPG','photos/Sony shots/DSC01470.JPG',
            'photos/Sony shots/DSC01489.JPG','photos/Sony shots/DSC01556.JPG',
            'photos/Sony shots/DSC01586.JPG','photos/Sony shots/DSC01598.JPG',
            'photos/Sony shots/DSC01716.JPG','photos/Sony shots/DSC01777.JPG',
            'photos/Sony shots/DSC01810.JPG','photos/Sony shots/DSC01860.JPG',
            'photos/Sony shots/DSC01874.JPG','photos/Sony shots/DSC01924.JPG',
            'photos/Sony shots/DSC01939.JPG','photos/Sony shots/DSC02105.JPG',
            'photos/Sony shots/DSC02205.JPG','photos/Sony shots/i like this.JPG'
        ];
        let currentIndex = 0;
        function enc(p) { return p.split('/').map(s=>encodeURIComponent(s)).join('/'); }
        function buildGallery() {
            const g = document.getElementById('gallery');
            photos.forEach((src,i) => {
                const item = document.createElement('div');
                item.className = 'gallery-item';
                item.onclick = () => openLightbox(i);
                const img = document.createElement('img');
                img.src = enc(src); img.alt = 'Photo ' + (i+1); img.loading = 'lazy';
                item.appendChild(img); g.appendChild(item);
            });
        }
        function openLightbox(i) {
            currentIndex = i;
            document.getElementById('lightbox-img').src = enc(photos[i]);
            document.getElementById('lightbox').classList.add('active');
            document.body.style.overflow = 'hidden';
        }
        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
            document.body.style.overflow = '';
        }
        function navigate(dir) {
            currentIndex = (currentIndex + dir + photos.length) % photos.length;
            document.getElementById('lightbox-img').src = enc(photos[currentIndex]);
        }
        document.addEventListener('keydown', e => {
            if (e.key==='Escape') closeLightbox();
            if (e.key==='ArrowRight') navigate(1);
            if (e.key==='ArrowLeft') navigate(-1);
        });
        buildGallery();
    </script>
</body>
</html>
