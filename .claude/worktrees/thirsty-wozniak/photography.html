<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photography — Amanda Cui</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased; background: #f5f0ea; color: #2e1f0e; }
        a { text-decoration: none; color: inherit; }
        header { padding: 2rem 3rem; display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid rgba(46,31,14,0.1); }
        .back { font-size: 0.85rem; font-weight: 500; color: rgba(46,31,14,0.5); transition: color 0.2s; }
        .back:hover { color: #2e1f0e; }
        .hero { padding: 5rem 3rem 3rem; border-bottom: 1px solid rgba(46,31,14,0.1); }
        .project-label { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase; color: rgba(46,31,14,0.4); margin-bottom: 1rem; }
        h1 { font-size: clamp(2.5rem, 6vw, 5.5rem); font-weight: 800; line-height: 1; letter-spacing: -0.03em; margin-bottom: 2rem; }
        .project-desc { max-width: 580px; font-size: 1.05rem; line-height: 1.75; color: rgba(46,31,14,0.65); }

        /* Masonry gallery */
        .gallery { padding: 3rem; column-count: 3; column-gap: 1rem; }
        .gallery-item { display: inline-block; width: 100%; margin-bottom: 1rem; break-inside: avoid; cursor: pointer; transition: opacity 0.2s; }
        .gallery-item:hover { opacity: 0.85; }
        .gallery-item img { width: 100%; height: auto; display: block; border-radius: 3px; }

        /* Lightbox */
        .lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; align-items: center; justify-content: center; }
        .lightbox.active { display: flex; }
        .lightbox img { max-width: 90%; max-height: 90%; object-fit: contain; }
        .lightbox-close { position: absolute; top: 20px; right: 20px; color: white; font-size: 28px; cursor: pointer; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.15); border-radius: 50%; }

        footer { padding: 2rem 3rem; border-top: 1px solid rgba(46,31,14,0.1); display: flex; justify-content: space-between; align-items: center; }
        footer span { font-size: 0.8rem; color: rgba(46,31,14,0.3); }

        @media (max-width: 900px) { .gallery { column-count: 2; } }
        @media (max-width: 700px) {
            header, .hero, footer { padding-left: 1.5rem; padding-right: 1.5rem; }
            .hero { padding-top: 3rem; }
            .gallery { padding: 1.5rem; column-count: 2; column-gap: 0.75rem; }
        }
        @media (max-width: 480px) { .gallery { column-count: 1; } }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="back">← Amanda Cui</a>
        <span style="font-size:0.75rem; color:rgba(46,31,14,0.3); font-weight:600; letter-spacing:0.1em; text-transform:uppercase;">05 of 06</span>
    </header>

    <section class="hero">
        <p class="project-label">Photography</p>
        <h1>Photography</h1>
        <p class="project-desc">A selection of photographic work exploring people, place, and everyday moments — shot on a Sony Alpha across Taiwan.</p>
    </section>

    <div class="gallery" id="gallery"></div>

    <footer>
        <a href="index.html" style="font-size:0.85rem; color:rgba(46,31,14,0.45);">← Back</a>
        <span>&copy; 2025 Amanda Cui</span>
    </footer>

    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
        <img id="lightboxImg" src="" alt="">
    </div>

    <script>
        const photos = [
            'photos/Sony%20shots/Alan.JPG','photos/Sony%20shots/chiangkaishek.JPG',
            'photos/Sony%20shots/DSC00028.JPG','photos/Sony%20shots/DSC00042.JPG',
            'photos/Sony%20shots/DSC00178.JPG','photos/Sony%20shots/DSC00268.JPG',
            'photos/Sony%20shots/DSC00269.JPG','photos/Sony%20shots/DSC00515.JPG',
            'photos/Sony%20shots/DSC00516.JPG','photos/Sony%20shots/DSC00653_0.JPG',
            'photos/Sony%20shots/DSC00968.JPG','photos/Sony%20shots/DSC01036.JPG',
            'photos/Sony%20shots/DSC01042.JPG','photos/Sony%20shots/DSC01215.JPG',
            'photos/Sony%20shots/DSC01352.JPG','photos/Sony%20shots/DSC01357.JPG',
            'photos/Sony%20shots/DSC01413.JPG','photos/Sony%20shots/DSC01470.JPG',
            'photos/Sony%20shots/DSC01489.JPG','photos/Sony%20shots/DSC01556.JPG',
            'photos/Sony%20shots/DSC01586.JPG','photos/Sony%20shots/DSC01598.JPG',
            'photos/Sony%20shots/DSC01716.JPG','photos/Sony%20shots/DSC01777.JPG',
            'photos/Sony%20shots/DSC01810.JPG','photos/Sony%20shots/DSC01860.JPG',
            'photos/Sony%20shots/DSC01874.JPG','photos/Sony%20shots/DSC01924.JPG',
            'photos/Sony%20shots/DSC01939.JPG','photos/Sony%20shots/DSC02105.JPG',
            'photos/Sony%20shots/DSC02205.JPG','photos/Sony%20shots/i%20like%20this.JPG'
        ];

        const gallery = document.getElementById('gallery');
        photos.forEach(src => {
            const item = document.createElement('div');
            item.className = 'gallery-item';
            item.onclick = () => openLightbox(src);
            const img = document.createElement('img');
            img.src = src;
            img.loading = 'lazy';
            item.appendChild(img);
            gallery.appendChild(item);
        });

        function openLightbox(src) {
            document.getElementById('lightboxImg').src = src;
            document.getElementById('lightbox').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
            document.body.style.overflow = '';
        }

        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });
    </script>
</body>
</html>
