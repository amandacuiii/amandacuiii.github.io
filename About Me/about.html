<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About — Amanda Cui</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Neuton:wght@300;400;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            font-family: 'Neuton', serif;
            background: #f9f6f2;
            color: #3d2e1c;
            -webkit-font-smoothing: antialiased;
        }

        a { text-decoration: none; color: inherit; }

        nav {
            position: fixed; top: 0; left: 0; right: 0; z-index: 50;
            height: 56px; display: flex; align-items: center; padding: 0 2.5rem;
            justify-content: space-between;
            background: rgba(249,246,242,0.85); backdrop-filter: blur(12px);
        }
        .nav-name {
            font-size: 0.9rem; font-weight: 500; letter-spacing: 0.08em;
            transition: color 0.2s;
        }
        .nav-name:hover { color: #664930; }
        .nav-links { display: flex; gap: 1.5rem; align-items: center; }
        .nav-link { font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; color: #9b8472; transition: color 0.2s; }
        .nav-link:hover { color: #3d2e1c; }
        /* ── Layout ── */
        .wrap {
            display: flex;
            height: 100vh;
            height: 100svh;
            padding-top: 56px;
        }

        /* Photo */
        .photo-side {
            width: 52%;
            flex-shrink: 0;
            overflow: hidden;
        }
        .photo-side img {
            width: 100%; height: 100%;
            object-fit: cover; display: block;
        }

        /* Text */
        .text-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0 5vw 0 5vw;
            gap: 2rem;
        }

        .about-name {
            font-size: clamp(2rem, 3.5vw, 3.2rem);
            font-weight: 300;
            letter-spacing: -0.01em;
            line-height: 1.1;
        }

        .about-bio {
            font-size: clamp(.95rem, 1.1vw, 1.05rem);
            line-height: 1.8;
            color: #6b5744;
            max-width: 38ch;
            text-align: center;
        }

        .social-links {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
        }
        .social-link {
            font-size: 0.72rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: #9b8472;
            transition: color 0.2s;
        }
        .social-link:hover { color: #3d2e1c; }

        /* ── Mobile ── */
        @media (max-width: 768px) {
            nav { padding: 0 1.25rem; }
            .wrap { flex-direction: column; height: auto; min-height: 100vh; }
            .photo-side { width: 100%; height: 70vw; }
            .text-side { padding: 3rem 1.5rem 5rem; }
        }
  
    /* ── Mobile navigation ───────────────────────── */
    .nav-toggle { display: none; }
    @media (max-width: 600px) {
      .nav-toggle {
        display: flex; flex-direction: column; justify-content: center;
        gap: 4px; width: 44px; height: 44px;
        margin-right: -10px; padding: 0 10px;
        background: none; border: none; cursor: pointer;
        color: inherit;
      }
      .nav-toggle span {
        display: block; height: 1px; width: 20px;
        background: currentColor; opacity: .75;
        transition: transform .25s ease, opacity .2s ease;
      }
      .nav-toggle.open span:nth-child(1) { transform: translateY(5px) rotate(45deg); }
      .nav-toggle.open span:nth-child(2) { opacity: 0; }
      .nav-toggle.open span:nth-child(3) { transform: translateY(-5px) rotate(-45deg); }

      .nav-links {
        display: flex; flex-direction: column; gap: 0;
        position: fixed; top: 56px; left: 0; right: 0; z-index: 60;
        background: #f9f6f2;
        border-bottom: 1px solid rgba(61,46,28,0.12);
        box-shadow: 0 12px 40px rgba(61,46,28,0.18);
        opacity: 0; transform: translateY(-6px); pointer-events: none;
        transition: opacity .2s ease, transform .2s ease;
      }
      .nav-links.open { opacity: 1; transform: none; pointer-events: auto; }
      .nav-link {
        padding: 1.05rem 1.4rem; font-size: .78rem;
        border-bottom: 1px solid rgba(61,46,28,0.08);
      }
    }
  </style>
</head>
<body>
    <nav>
        <a href="../Title%20Page/" class="nav-name">Amanda Cui</a>
        <button class="nav-toggle" aria-label="Open menu" aria-expanded="false" onclick="toggleNav()"><span></span><span></span><span></span></button>
    <div class="nav-links" id="navLinks">
            <a href="../pottery/pottery.html" class="nav-link">Pottery</a>
            <a href="../storytelling/storytelling.html" class="nav-link">Storytelling</a>
            <a href="../saatomo/" class="nav-link">Gathering</a>
            <a href="../creative%20collaborations/creative-collaborations.html" class="nav-link">Collabs</a>
        </div>
    </nav>

    <div class="wrap">
        <div class="photo-side">
            <img src="../Title%20Page/about/photoshoot-photo.jpg" alt="Amanda Cui">
        </div>
        <div class="text-side">
            <div class="about-name">Amanda Cui</div>
            <p class="about-bio">Visual storyteller working across photography, film, and ceramics. Fulbright Fellow in Taiwan. Interested in people, place, and the small moments that make everyday life feel meaningful.</p>
            <div class="social-links">
                <a href="https://www.instagram.com/amandacuii" target="_blank" rel="noopener noreferrer" class="social-link">Instagram</a>
                <a href="https://www.linkedin.com/in/amanda-cui-9072381b0" target="_blank" rel="noopener noreferrer" class="social-link">LinkedIn</a>
                <a href="mailto:amandacuicollab@gmail.com" class="social-link">Email</a>
            </div>
        </div>
    </div>
<script>
  function toggleNav() {
    var links = document.getElementById('navLinks');
    var btn = document.querySelector('.nav-toggle');
    var open = links.classList.toggle('open');
    btn.classList.toggle('open', open);
    btn.setAttribute('aria-expanded', open);
    btn.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
  }
  document.addEventListener('click', function(e) {
    var links = document.getElementById('navLinks');
    if (!links || !links.classList.contains('open')) return;
    if (e.target.closest('.nav-toggle')) return;
    if (e.target.closest('.nav-link')) { toggleNav(); return; }
    if (!e.target.closest('.nav-links')) toggleNav();
  });
</script>
</body>
</html>
