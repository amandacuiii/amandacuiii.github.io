<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Storytelling — Amanda Cui</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Neuton:wght@300;400;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: 'Neuton', serif;
      background: #0d0d0d;
      color: #f2ede8;
      -webkit-font-smoothing: antialiased;
    }

    a { text-decoration: none; color: inherit; }

    /* ── Nav ─────────────────────────────────────── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 200;
      height: 56px; display: flex; align-items: center;
      justify-content: space-between; padding: 0 2rem;
      background: rgba(13,13,13,0.9); backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(242,237,232,0.07);
    }
    .nav-name {
      font-size: .88rem; font-weight: 500; letter-spacing: .08em;
      transition: color .2s;
    }
    .nav-name:hover { color: #c8a882; }
    .nav-label {
      font-size: .72rem; letter-spacing: .18em; text-transform: uppercase;
      color: rgba(242,237,232,0.3);
    }

    /* ── Layout ──────────────────────────────────── */
    .layout {
      display: flex;
      height: 100vh;
      padding-top: 56px;
    }

    /* ── Sidebar ─────────────────────────────────── */
    .sidebar {
      width: 300px; flex-shrink: 0;
      display: flex; flex-direction: column; justify-content: center;
      padding: 3rem 2.5rem;
      border-right: 1px solid rgba(242,237,232,0.08);
      overflow-y: auto;
      gap: 0;
    }

    .project-item {
      padding: 2.2rem 0;
      cursor: pointer;
      border-bottom: 1px solid rgba(242,237,232,0.07);
      opacity: 0.3;
      transition: opacity 0.35s ease;
      user-select: none;
      position: relative;
    }
    .project-item:first-child { border-top: 1px solid rgba(242,237,232,0.07); }
    .project-item.active { opacity: 1; }
    .project-item:not(.active):hover { opacity: 0.65; }

    /* Active left bar */
    .project-item::before {
      content: '';
      position: absolute; left: -2.5rem; top: 50%; transform: translateY(-50%);
      width: 2px; height: 0;
      background: #c8a882;
      transition: height 0.35s ease;
    }
    .project-item.active::before { height: 2.5rem; }

    .project-num {
      font-size: .6rem; letter-spacing: .22em; text-transform: uppercase;
      color: rgba(242,237,232,0.35); margin-bottom: .6rem;
      transition: color 0.35s;
    }
    .project-item.active .project-num { color: #c8a882; }

    .project-title {
      font-size: clamp(1rem, 1.6vw, 1.35rem);
      font-weight: 300; line-height: 1.25;
      letter-spacing: -0.01em;
    }
    .project-meta {
      font-size: .7rem; letter-spacing: .07em;
      color: rgba(242,237,232,0.3); margin-top: .5rem;
    }

    /* ── Content area ────────────────────────────── */
    .content-area {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .project-panel {
      position: absolute; inset: 0;
      opacity: 0; pointer-events: none;
      transition: opacity 0.4s ease;
    }
    .project-panel.active {
      opacity: 1; pointer-events: all;
    }

    /* iframe panel */
    .project-panel iframe {
      width: 100%; height: 100%; border: none; display: block;
    }

    /* placeholder panel */
    .placeholder-panel {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 1.2rem;
      position: relative; overflow: hidden;
    }
    .placeholder-panel .bg {
      position: absolute; inset: 0;
      background-size: cover; background-position: center;
      filter: brightness(0.25);
    }
    .placeholder-panel .ph-content {
      position: relative; z-index: 1; text-align: center;
    }
    .placeholder-panel h2 {
      font-size: clamp(1.6rem, 3vw, 2.8rem);
      font-weight: 300; letter-spacing: -.01em; margin-bottom: .6rem;
    }
    .placeholder-panel .ph-tag {
      font-size: .68rem; letter-spacing: .2em; text-transform: uppercase;
      color: rgba(242,237,232,0.35);
    }
    .placeholder-panel .ph-soon {
      margin-top: 2rem;
      font-size: .7rem; letter-spacing: .18em; text-transform: uppercase;
      color: #c8a882; opacity: .6;
      border: 1px solid rgba(200,168,130,0.25); border-radius: 4px;
      padding: .4rem .9rem;
    }

    /* ── Mobile ──────────────────────────────────── */
    @media (max-width: 768px) {
      /* Keep overflow hidden so the layout fills the screen */
      html, body { overflow: hidden; }

      .layout {
        flex-direction: column;
        height: 100vh;
        padding-top: 56px;
      }

      /* Sidebar → horizontal scroll tab strip */
      .sidebar {
        width: 100%;
        flex-direction: row;
        justify-content: flex-start;
        align-items: stretch;
        padding: 0;
        border-right: none;
        border-bottom: 1px solid rgba(242,237,232,0.08);
        overflow-x: auto;
        overflow-y: hidden;
        flex-shrink: 0;
        height: 54px;
        scrollbar-width: none;
      }
      .sidebar::-webkit-scrollbar { display: none; }

      .project-item {
        padding: 0 1.4rem;
        border-bottom: none;
        border-right: 1px solid rgba(242,237,232,0.07);
        border-top: none !important;
        flex-shrink: 0;
        white-space: nowrap;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      /* Active indicator: bottom bar instead of left bar */
      .project-item::before {
        left: 50%; top: auto; bottom: 0;
        transform: translateX(-50%);
        width: 0; height: 2px;
        transition: width 0.35s ease;
      }
      .project-item.active::before { width: 65%; height: 2px; }

      .project-meta { display: none; }
      .project-num { margin-bottom: .2rem; font-size: .55rem; }
      .project-title { font-size: .85rem; }

      /* Content fills remaining viewport */
      .content-area {
        flex: 1;
        overflow: hidden;
        position: relative;
        min-height: 0;
      }

      .project-panel { position: absolute; inset: 0; }

      /* iOS iframe scrolling */
      .project-panel iframe {
        overflow-y: scroll;
        -webkit-overflow-scrolling: touch;
      }

      /* Placeholder panels: slightly larger text on small screens */
      .placeholder-panel h2 { font-size: clamp(1.3rem, 6vw, 2rem); }
    }

    @media (max-width: 400px) {
      .project-title { font-size: .78rem; }
      nav { padding: 0 1rem; }
    }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-name">Amanda Cui</a>
  <span class="nav-label">Storytelling</span>
</nav>

<div class="layout">

  <!-- ── Sidebar ──────────────────────────────────── -->
  <aside class="sidebar">

    <div class="project-item active" data-project="taiwan" onclick="showProject('taiwan')">
      <div class="project-num">01</div>
      <div class="project-title">Taiwan Through Our Eyes</div>
      <div class="project-meta">Documentary · 2024</div>
    </div>

    <div class="project-item" data-project="shiyuan" onclick="showProject('shiyuan')">
      <div class="project-num">02</div>
      <div class="project-title">Humans of Shi Yuan</div>
      <div class="project-meta">Photo series · 2024</div>
    </div>

    <div class="project-item" data-project="penn" onclick="showProject('penn')">
      <div class="project-num">03</div>
      <div class="project-title">Humans of Penn</div>
      <div class="project-meta">Photo series · 2022–2023</div>
    </div>

  </aside>

  <!-- ── Content panels ───────────────────────────── -->
  <main class="content-area">

    <!-- 01 · Taiwan Through Our Eyes (iframe) -->
    <div class="project-panel active" id="panel-taiwan">
      <iframe src="taiwan.html"
        sandbox="allow-scripts allow-same-origin allow-popups allow-forms"
        loading="lazy"
        title="Taiwan Through Our Eyes">
      </iframe>
    </div>

    <!-- 02 · Humans of Shi Yuan (placeholder) -->
    <div class="project-panel" id="panel-shiyuan">
      <div class="placeholder-panel">
        <div class="bg" style="background-image: url('photos/Title Page/storytelling/JPEG image 3.jpeg')"></div>
        <div class="ph-content">
          <h2>Humans of Shi Yuan</h2>
          <div class="ph-tag">Photo series · Taichung, Taiwan</div>
          <div class="ph-soon">Coming soon</div>
        </div>
      </div>
    </div>

    <!-- 03 · Humans of Penn (placeholder) -->
    <div class="project-panel" id="panel-penn">
      <div class="placeholder-panel">
        <div class="bg" style="background-image: url('photos/Title Page/storytelling/DSC05037 copy.JPG')"></div>
        <div class="ph-content">
          <h2>Humans of Penn</h2>
          <div class="ph-tag">Photo series · Philadelphia, PA</div>
          <div class="ph-soon">Coming soon</div>
        </div>
      </div>
    </div>

  </main>
</div>

<script>
  function showProject(id) {
    document.querySelectorAll('.project-item').forEach(el =>
      el.classList.toggle('active', el.dataset.project === id)
    );
    document.querySelectorAll('.project-panel').forEach(el =>
      el.classList.toggle('active', el.id === 'panel-' + id)
    );
  }
</script>
</body>
</html>
