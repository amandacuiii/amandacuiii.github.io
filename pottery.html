<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The First 100 — Amanda Cui</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&family=Karla:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f9f6f2;
            --text: #3d2e1c;
            --accent: #664930;
            --muted: #9b8472;
            --font: 'Karla', sans-serif;
            --font-heading: 'Rubik', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        a { text-decoration: none; color: inherit; }

        nav {
            position: fixed; top: 0; left: 0; right: 0; z-index: 50;
            height: 56px; display: flex; align-items: center; padding: 0 2.5rem;
            background: rgba(249,246,242,0.85); backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .nav-name {
            font-family: var(--font-heading); font-size: 0.9rem;
            font-weight: 500; letter-spacing: 0.08em; transition: color 0.2s;
        }

        .nav-name:hover { color: var(--accent); }

        .page-header {
            padding: 5.5rem 6vw 2.5rem;
        }

        .page-header h1 {
            font-family: var(--font-heading);
            font-size: clamp(2rem, 5vw, 4rem);
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .page-header p {
            margin-top: 0.75rem;
            font-size: 1rem;
            color: var(--muted);
            max-width: 44ch;
            line-height: 1.6;
        }

        .piece-count {
            display: inline-block;
            margin-top: 1rem;
            font-size: 0.8rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
        }

        /* Gallery grid — natural proportions like freckleclay */
        .gallery {
            padding: 0 6vw 6rem;
            columns: 3;
            column-gap: 16px;
        }

        .piece {
            break-inside: avoid;
            margin-bottom: 16px;
            cursor: pointer;
        }

        .piece-img-wrap {
            position: relative;
            overflow: hidden;
        }

        .piece-img-wrap {
            aspect-ratio: 1 / 1;
        }

        .piece-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .piece:hover .piece-img-wrap img {
            transform: scale(1.04);
        }

        .piece-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-family: var(--font-heading);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .badge-complete    { background: rgba(200,232,200,0.9); color: #2a6030; }
        .badge-available   { background: rgba(168,208,208,0.9); color: #2a6060; }
        .badge-in-progress { background: rgba(236,224,192,0.9); color: #705020; }
        .badge-throwing    { background: rgba(212,232,240,0.9); color: #2a6080; }
        .badge-trimming    { background: rgba(220,232,208,0.9); color: #3a6030; }
        .badge-leatherhard { background: rgba(236,224,192,0.9); color: #705020; }
        .badge-bonedry     { background: rgba(232,224,208,0.9); color: #605040; }
        .badge-bisque      { background: rgba(232,196,168,0.9); color: #9e5438; }
        .badge-glazed      { background: rgba(168,208,208,0.9); color: #2a6060; }

        .piece-info {
            padding: 10px 2px 4px;
        }

        .piece-name {
            font-family: var(--font-heading);
            font-size: 0.88rem;
            font-weight: 500;
            color: var(--text);
        }

        .piece-home {
            font-size: 0.78rem;
            color: var(--muted);
            margin-top: 2px;
        }

        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(20, 12, 5, 0.97);
            z-index: 200;
            overflow-y: auto;
        }

        .lightbox.active { display: block; }

        .lightbox-close {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            color: rgba(255,255,255,0.6);
            font-size: 1.8rem;
            cursor: pointer;
            z-index: 201;
            line-height: 1;
            transition: color 0.2s;
            width: 2.5rem;
            height: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lightbox-close:hover { color: #fff; }

        .lightbox-body {
            max-width: 960px;
            margin: 0 auto;
            padding: 4rem 2rem 5rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            align-items: start;
        }

        .lightbox-main-img {
            width: 100%;
            height: auto;
            display: block;
        }

        .lightbox-info {
            color: #f9f6f2;
            padding-top: 0.5rem;
        }

        .lightbox-number {
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: rgba(249,246,242,0.45);
            margin-bottom: 0.75rem;
        }

        .lightbox-name {
            font-family: var(--font-heading);
            font-size: clamp(1.5rem, 3vw, 2.5rem);
            font-weight: 500;
            line-height: 1.1;
            margin-bottom: 1rem;
        }

        .lightbox-desc {
            font-size: 0.95rem;
            line-height: 1.7;
            color: rgba(249,246,242,0.7);
            margin-bottom: 1.25rem;
        }

        .lightbox-home {
            font-size: 0.8rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: rgba(249,246,242,0.4);
        }

        .lightbox-progress {
            margin-top: 2rem;
        }

        .lightbox-progress-label {
            font-size: 0.7rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: rgba(249,246,242,0.35);
            margin-bottom: 0.75rem;
        }

        .lightbox-progress-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 6px;
        }

        .lightbox-progress-grid img {
            width: 100%;
            height: 70px;
            object-fit: cover;
            display: block;
            opacity: 0.8;
            transition: opacity 0.2s;
            cursor: pointer;
        }

        .lightbox-progress-grid img:hover { opacity: 1; }

        /* Full image overlay */
        .img-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.97);
            z-index: 300;
            align-items: center;
            justify-content: center;
        }

        .img-overlay.active { display: flex; }

        .img-overlay img {
            max-width: 92vw;
            max-height: 92vh;
            object-fit: contain;
        }

        .img-overlay-close {
            position: fixed;
            top: 1.5rem; right: 1.5rem;
            color: rgba(255,255,255,0.6);
            font-size: 1.8rem;
            cursor: pointer;
            z-index: 301;
            transition: color 0.2s;
        }

        .img-overlay-close:hover { color: #fff; }

        /* Loading */
        .loading {
            padding: 5rem 6vw;
            color: var(--muted);
            font-size: 0.9rem;
        }

        @media (max-width: 900px) {
            .lightbox-body { grid-template-columns: 1fr; gap: 1.5rem; }
        }

        @media (max-width: 750px) {
            .gallery { columns: 2; }
        }

        @media (max-width: 480px) {
            .gallery { columns: 1; }
        }
    </style>
</head>
<body>
    <nav><a href="index.html" class="nav-name">Amanda Cui</a></nav>

    <div class="page-header">
        <h1>the first 100</h1>
        <p>A documentation of my pottery journey — from the first piece to the hundredth.</p>
        <span class="piece-count" id="piece-count"></span>
    </div>

    <div class="gallery" id="gallery">
        <div class="loading">Loading pieces...</div>
    </div>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox" onclick="if(event.target.id==='lightbox')closeLightbox()">
        <span class="lightbox-close" onclick="closeLightbox()">&#215;</span>
        <div class="lightbox-body" id="lightbox-body"></div>
    </div>

    <!-- Full image overlay -->
    <div class="img-overlay" id="imgOverlay" onclick="closeImgOverlay()">
        <span class="img-overlay-close" onclick="closeImgOverlay()">&#215;</span>
        <img id="imgOverlayImg" src="" alt="">
    </div>

    <script>
        let pieces = [];

        const STAGE_MAP = {
            'throwing':    { cls: 'badge-throwing',    label: 'Throwing' },
            'trimming':    { cls: 'badge-trimming',    label: 'Trimming' },
            'leatherhard': { cls: 'badge-leatherhard', label: 'Leather Hard' },
            'leather hard':{ cls: 'badge-leatherhard', label: 'Leather Hard' },
            'bone dry':    { cls: 'badge-bonedry',     label: 'Bone Dry' },
            'bonedry':     { cls: 'badge-bonedry',     label: 'Bone Dry' },
            'bisque':      { cls: 'badge-bisque',      label: 'Bisque' },
            'glazed':      { cls: 'badge-glazed',      label: 'Glazed' },
            'complete':    { cls: 'badge-complete',    label: 'Complete' },
        };

        function getBadge(home) {
            if (!home) return null;
            const h = home.toLowerCase().trim();
            if (STAGE_MAP[h]) return STAGE_MAP[h];
            if (h.includes('available') || h.includes('for sale')) return { cls: 'badge-available', label: 'Available' };
            return { cls: 'badge-complete', label: home };
        }

        function enc(p) {
            return p.split('/').map(s => encodeURIComponent(s)).join('/');
        }

        function buildGallery(data) {
            pieces = data;
            const gallery = document.getElementById('gallery');
            const count = document.getElementById('piece-count');
            count.textContent = `${pieces.length} pieces`;
            gallery.innerHTML = '';

            pieces.forEach((piece, i) => {
                const div = document.createElement('div');
                div.className = 'piece';
                div.onclick = () => openLightbox(i);

                const badge = getBadge(piece.home);

                div.innerHTML = `
                    <div class="piece-img-wrap">
                        <img src="${enc(piece.mainImage)}" alt="${piece.name}" loading="lazy">
                        ${badge ? `<span class="piece-badge ${badge.cls}">${badge.label}</span>` : ''}
                    </div>
                    <div class="piece-info">
                        <div class="piece-name">${piece.name}</div>
                        ${piece.home ? `<div class="piece-home">${piece.home}</div>` : ''}
                    </div>
                `;
                gallery.appendChild(div);
            });
        }

        function openLightbox(i) {
            const piece = pieces[i];
            const body = document.getElementById('lightbox-body');

            const progressHtml = piece.progressPhotos && piece.progressPhotos.length > 0
                ? `<div class="lightbox-progress">
                    <div class="lightbox-progress-label">Progress photos</div>
                    <div class="lightbox-progress-grid">
                        ${piece.progressPhotos.map(p => `<img src="${enc(p)}" alt="progress" onclick="openImgOverlay('${enc(p)}')" loading="lazy">`).join('')}
                    </div>
                   </div>`
                : '';

            body.innerHTML = `
                <img class="lightbox-main-img" src="${enc(piece.mainImage)}" alt="${piece.name}">
                <div class="lightbox-info">
                    <div class="lightbox-number">No. ${String(piece.id).padStart(2, '0')}</div>
                    <div class="lightbox-name">${piece.name}</div>
                    ${piece.description ? `<div class="lightbox-desc">${piece.description}</div>` : ''}
                    ${piece.home ? `<div class="lightbox-home">${piece.home}</div>` : ''}
                    ${progressHtml}
                </div>
            `;

            document.getElementById('lightbox').classList.add('active');
            document.getElementById('lightbox').scrollTop = 0;
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
            document.body.style.overflow = '';
        }

        function openImgOverlay(src) {
            document.getElementById('imgOverlayImg').src = src;
            document.getElementById('imgOverlay').classList.add('active');
        }

        function closeImgOverlay() {
            document.getElementById('imgOverlay').classList.remove('active');
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') {
                closeImgOverlay();
                closeLightbox();
            }
        });

        fetch('pottery-data.json')
            .then(r => r.json())
            .then(buildGallery)
            .catch(() => {
                document.getElementById('gallery').innerHTML =
                    '<div class="loading">Could not load pieces.</div>';
            });
    </script>
</body>
</html>
