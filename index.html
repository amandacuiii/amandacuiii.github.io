<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amanda Cui</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Neuton:wght@300;400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --font: 'Neuton', serif;
            --font-heading: 'Neuton', serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111;
        }

        a { text-decoration: none; color: inherit; }

        .site-name {
            position: fixed;
            top: 1.5rem;
            left: 2rem;
            z-index: 20;
            font-family: var(--font-heading);
            font-size: 0.95rem;
            font-weight: 500;
            color: #fff;
            letter-spacing: 0.08em;
            text-shadow: 0 1px 6px rgba(0,0,0,0.5);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: 40vh 30vh 30vh;
            width: 100vw;
            height: 100vh;
            gap: 3px;
            background: #111;
        }

        .tile {
            position: relative;
            overflow: hidden;
            display: block;
        }

        .tile-1 { grid-column: 1; grid-row: 1 / 3; }
        .tile-2 { grid-column: 2; grid-row: 1; }
        .tile-3 { grid-column: 3; grid-row: 1 / 4; }
        .tile-4 { grid-column: 1; grid-row: 3; }
        .tile-5 { grid-column: 2; grid-row: 2 / 4; }

        /* Two stacked images per tile for crossfade */
        .tile img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: opacity 1.2s ease, transform 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .tile img.behind  { opacity: 0; z-index: 1; }
        .tile img.current { opacity: 1; z-index: 2; }

        .tile:hover img.current { transform: scale(1.05); }

        .tile-overlay {
            position: absolute;
            inset: 0;
            z-index: 3;
            background: rgba(0, 0, 0, 0);
            transition: background 0.45s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tile:hover .tile-overlay { background: rgba(0, 0, 0, 0.45); }

        .tile-title {
            font-family: var(--font-heading);
            font-size: clamp(0.85rem, 1.6vw, 1.4rem);
            font-weight: 500;
            color: #fff;
            letter-spacing: 0.06em;
            text-align: center;
            padding: 0 1.5rem;
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .tile:hover .tile-title { opacity: 1; transform: translateY(0); }

        @media (max-width: 700px) {
            html, body { overflow-y: auto; }
            .grid {
                grid-template-columns: 1fr 1fr;
                grid-template-rows: 50vw 50vw 50vw;
                height: auto;
            }
            .tile-1 { grid-column: 1; grid-row: 1; }
            .tile-2 { grid-column: 2; grid-row: 1; }
            .tile-3 { grid-column: 1; grid-row: 2; }
            .tile-4 { grid-column: 2; grid-row: 2; }
            .tile-5 { grid-column: 1 / -1; grid-row: 3; }
            .tile-title { opacity: 1; transform: none; font-size: 0.85rem; }
            .tile-overlay { background: rgba(0,0,0,0.3); }
        }
    </style>
</head>
<body>
    <div class="site-name">Amanda Cui</div>

    <div class="grid">
        <a href="pottery.html" class="tile tile-1" data-tile="pottery">
            <img class="current" src="photos/Title Page/pottery progress/background.jpeg" alt="" loading="eager">
            <img class="behind"  src="" alt="">
            <div class="tile-overlay"><div class="tile-title">pottery progress</div></div>
        </a>

        <a href="taiwan.html" class="tile tile-2" data-tile="taiwan">
            <img class="current" src="photos/Title Page/taiwan through our eyes /DSC01598.JPG" alt="" loading="eager">
            <img class="behind"  src="" alt="">
            <div class="tile-overlay"><div class="tile-title">taiwan through our eyes</div></div>
        </a>

        <a href="videography.html" class="tile tile-3" data-tile="storytelling">
            <img class="current" src="photos/Title Page/storytelling/DSC01357.JPG" alt="" loading="eager">
            <img class="behind"  src="" alt="">
            <div class="tile-overlay"><div class="tile-title">storytelling</div></div>
        </a>

        <a href="photography.html" class="tile tile-4" data-tile="photography">
            <img class="current" src="photos/Title Page/photography/DSC01470.JPG" alt="" loading="eager">
            <img class="behind"  src="" alt="">
            <div class="tile-overlay"><div class="tile-title">photography</div></div>
        </a>

        <a href="about.html" class="tile tile-5" data-tile="about">
            <img class="current" src="photos/Title Page/about/photoshoot-photo.jpg" alt="" loading="eager">
            <img class="behind"  src="" alt="">
            <div class="tile-overlay"><div class="tile-title">about</div></div>
        </a>
    </div>

    <script>
        const PHOTOS = {
            pottery: [
                'photos/Title Page/pottery progress/background.jpeg'
            ],
            taiwan: [
                'photos/Title Page/taiwan through our eyes /DSC01598.JPG',
                'photos/Title Page/taiwan through our eyes /DSC00653_0.JPG',
                'photos/Title Page/taiwan through our eyes /DSC00968.JPG',
                'photos/Title Page/taiwan through our eyes /DSC02105.JPG',
                'photos/Title Page/taiwan through our eyes /DSC04720 copy.JPG',
                'photos/Title Page/taiwan through our eyes /DSC04821 copy.JPG',
            ],
            storytelling: [
                'photos/Title Page/storytelling/DSC01357.JPG',
                'photos/Title Page/storytelling/DSC05037 copy.JPG',
                'photos/Title Page/storytelling/JPEG image 3.jpeg',
            ],
            photography: [
                'photos/Title Page/photography/DSC01470.JPG',
                'photos/Title Page/photography/Alan.JPG',
                'photos/Title Page/photography/DSC00042.JPG',
                'photos/Title Page/photography/DSC00178.JPG',
                'photos/Title Page/photography/DSC00268.JPG',
                'photos/Title Page/photography/DSC00269.JPG',
                'photos/Title Page/photography/DSC00516.JPG',
                'photos/Title Page/photography/DSC01036.JPG',
                'photos/Title Page/photography/DSC01042.JPG',
                'photos/Title Page/photography/DSC01215.JPG',
                'photos/Title Page/photography/DSC01352.JPG',
                'photos/Title Page/photography/DSC01413.JPG',
                'photos/Title Page/photography/DSC01489.JPG',
                'photos/Title Page/photography/DSC01556.JPG',
                'photos/Title Page/photography/DSC01586.JPG',
                'photos/Title Page/photography/DSC01716.JPG',
                'photos/Title Page/photography/DSC01777.JPG',
                'photos/Title Page/photography/DSC01810.JPG',
                'photos/Title Page/photography/DSC01860.JPG',
                'photos/Title Page/photography/DSC01874.JPG',
                'photos/Title Page/photography/DSC01924.JPG',
                'photos/Title Page/photography/DSC01939.JPG',
                'photos/Title Page/photography/DSC02205.JPG',
                'photos/Title Page/photography/chiangkaishek.JPG',
                'photos/Title Page/photography/i like this.JPG',
            ],
            about: [
                'photos/Title Page/about/photoshoot-photo.jpg',
                'photos/Title Page/about/DSC00497.JPG',
                'photos/Title Page/about/DSC00855.JPG',
                'photos/Title Page/about/DSC01178.JPG',
                'photos/Title Page/about/DSC04855 copy.JPG',
            ],
        };

        // Track current index per tile
        const state = {};
        document.querySelectorAll('.tile[data-tile]').forEach(tile => {
            const key = tile.dataset.tile;
            const photos = PHOTOS[key];
            if (!photos || photos.length <= 1) return;

            state[key] = 0;

            // Stagger start times so tiles don't all switch at once
            const offset = Math.random() * 800;

            setTimeout(() => {
                setInterval(() => {
                    const photos = PHOTOS[key];
                    const nextIdx = (state[key] + 1) % photos.length;
                    const current = tile.querySelector('img.current');
                    const behind  = tile.querySelector('img.behind');

                    // Preload next photo into behind layer
                    behind.src = photos[nextIdx];
                    behind.onload = () => {
                        // Swap: behind becomes current, current becomes behind
                        behind.classList.replace('behind', 'current');
                        current.classList.replace('current', 'behind');
                        current.style.opacity = '0';
                        behind.style.opacity = '';
                        state[key] = nextIdx;
                    };
                }, 4000);
            }, offset);
        });
    </script>
</body>
</html>
