<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amanda Cui</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&family=Karla:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --font: 'Karla', sans-serif;
            --font-heading: 'Rubik', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111;
        }

        a { text-decoration: none; color: inherit; }

        /* Site name */
        .site-name {
            position: fixed;
            top: 1.5rem;
            left: 2rem;
            z-index: 20;
            font-family: var(--font-heading);
            font-size: 0.95rem;
            font-weight: 500;
            color: #fff;
            letter-spacing: 0.08em;
            mix-blend-mode: normal;
            text-shadow: 0 1px 6px rgba(0,0,0,0.5);
        }

        /* Grid */
        .grid {
            display: grid;
            grid-template-columns: 38% 31% 31%;
            grid-template-rows: 55vh 45vh;
            width: 100vw;
            height: 100vh;
            gap: 3px;
            background: #111;
        }

        .tile {
            position: relative;
            overflow: hidden;
            display: block;
        }

        .tile-1 { grid-column: 1; grid-row: 1 / 3; }
        .tile-2 { grid-column: 2; grid-row: 1; }
        .tile-3 { grid-column: 2; grid-row: 2; }
        .tile-4 { grid-column: 3; grid-row: 1; }
        .tile-5 { grid-column: 3; grid-row: 2; }

        .tile img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .tile:hover img {
            transform: scale(1.05);
        }

        /* Overlay */
        .tile-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0);
            transition: background 0.45s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .tile:hover .tile-overlay {
            background: rgba(0, 0, 0, 0.45);
        }

        .tile-title {
            font-family: var(--font-heading);
            font-size: clamp(0.9rem, 1.8vw, 1.5rem);
            font-weight: 500;
            color: #fff;
            letter-spacing: 0.06em;
            text-align: center;
            padding: 0 1.5rem;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .tile:hover .tile-title {
            opacity: 1;
            transform: translateY(0);
        }

        /* Mobile — 2-col grid */
        @media (max-width: 700px) {
            html, body { overflow-y: auto; }

            .grid {
                grid-template-columns: 1fr 1fr;
                grid-template-rows: 50vw 50vw 50vw;
                height: auto;
            }

            .tile-1 { grid-column: 1; grid-row: 1; }
            .tile-2 { grid-column: 2; grid-row: 1; }
            .tile-3 { grid-column: 1; grid-row: 2; }
            .tile-4 { grid-column: 2; grid-row: 2; }
            .tile-5 { grid-column: 1 / -1; grid-row: 3; }

            .tile-title { opacity: 1; transform: none; font-size: 0.85rem; }
            .tile-overlay { background: rgba(0,0,0,0.3); }
        }
    </style>
</head>
<body>
    <div class="site-name">Amanda Cui</div>

    <div class="grid">
        <a href="pottery.html" class="tile tile-1">
            <img src="photos/Sony shots/DSC01470.JPG" alt="the first 100" loading="eager">
            <div class="tile-overlay">
                <div class="tile-title">the first 100</div>
            </div>
        </a>

        <a href="taiwan.html" class="tile tile-2">
            <img src="photos/Sony shots/DSC00268.JPG" alt="taiwan through our eyes" loading="eager">
            <div class="tile-overlay">
                <div class="tile-title">taiwan through our eyes</div>
            </div>
        </a>

        <a href="videography.html" class="tile tile-3">
            <img src="photos/Sony shots/DSC01924.JPG" alt="videography" loading="eager">
            <div class="tile-overlay">
                <div class="tile-title">videography</div>
            </div>
        </a>

        <a href="photography.html" class="tile tile-4">
            <img src="photos/Sony shots/Alan.JPG" alt="photography" loading="eager">
            <div class="tile-overlay">
                <div class="tile-title">photography</div>
            </div>
        </a>

        <a href="about.html" class="tile tile-5">
            <img src="photos/Photos of me/photoshoot-photo.jpg" alt="about" loading="eager">
            <div class="tile-overlay">
                <div class="tile-title">about</div>
            </div>
        </a>
    </div>


</body>
</html>
